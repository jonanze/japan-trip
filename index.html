{"id":"i04","time":"07:45–11:39","title":"Transit · Haneda → Shinjuku → Matsumoto (Ltd Exp Azusa 9)","kind":"travel","how":"Airport Limousine bus T2 → Shinjuku Sta West Exit (Keiō Dept Store), ¥1,400 pp, 07:45 → 08:20 timetabled (allow 60–70 min on a Monday morning). The bus starts at T3 and calls at T2 10 min later\nLtd Exp Azusa 9: Shinjuku 09:00 → Matsumoto 11:39 (reserved seats, ~¥6,700 pp)","notes":"05:55 Land at T2\n06:00–07:00 Immigration, bags, customs\n07:00–07:35 Seven Bank ATM for ¥ (T2 2F Welcome Center, 06:00–23:00), toilets; then down to 1F for bus tickets (Limousine ticket machines / counter) and the bus stop outside\n07:45 Bus from T2 (take the 07:25 if out early); bags go under the bus\n08:20 Shinjuku West Exit (timetabled; ~08:35 in Monday traffic); 5–10 min walk to the JR gates\n08:40 Print the Azusa tickets at a reserved-seat machine (QR from the booking); drinks or an ekiben\n08:50 On the platform\n09:00 Depart\n11:39 Matsumoto; 5 min walk to Dormy Inn\nOut by ~06:45: 06:55 bus, switch to Azusa 5 (08:00 → 10:37). Out after 07:45: 08:15 bus, switch to Azusa 13 (10:00 → 12:37). One free change at the machine\nIf you land at T3 instead: same buses 10 min earlier (06:45 / 07:15 / 07:35 / 08:05); Seven Bank ATM and Limousine counter are in the T3 arrivals hall, 2F; the Azusa 9 plan holds\nRail alt (~¥540 pp): Keikyū from Haneda T1·T2 Sta → Shinagawa → JR Yamanote Line → Shinjuku, ~45 min, but Monday rush hour with suitcases\nTaxi alt: fixed fare ~¥9,000 + tolls per car to Shinjuku","places":["shinjuku","mmstn"],"action":"★ Reserve Azusa 9 seats on eki-net (opens 9 Oct, 10:00 JST)"},
{"id":"i05","time":"11:45","title":"Drop bags · Dormy Inn Matsumoto (1 nt)","kind":"stay","how":"Dormy Inn Matsumoto, 2-2-1 Fukashi, Matsumoto 〒390-0815 (☎ 0263-33-5489)\n5 min walk from JR Matsumoto Sta\nMC 75 821 318*64","notes":"Drop bags on arrival; check in properly later. Natural onsen; breakfast incl.; 2 rooms","places":["dormy"],"mode":"walking","action":"Future payment 6 Nov (S$)"},
{"id":"i06","time":"12:15","title":"Lunch · Sobakiri Miyota (toji-soba)","kind":"food","how":"Gokō Honmachi Bldg 1F, 2-1-24 Chūō, Matsumoto; 5 min walk from the station and Dormy Inn","notes":"Tabelog 3.49; Matsumoto's toji-soba (soba dipped shabu-style in hot sansai broth). Kitchen L.O. 14:30 sharp and it can sell out, so go straight from the station if the train runs late. Closed Thu. Backup: Kurekino, station bldg 1F (all-day soba, Tabelog 3.49)","places":["miyota_m"],"mode":"walking"},
{"id":"i07","time":"~13:30","title":"Former Kaichi School (旧開智学校), National Treasure","kind":"visit","how":"2-4-12 Kaichi, Matsumoto 〒390-0876\n~20–25 min walk from Dormy Inn via Nawate-dōri (or Town Sneaker North bus)","notes":"Reopened Nov 2024 after a 3-year seismic retrofit. 09:00–17:00 (last entry 16:30), ¥700. Open Mon 9 Nov (Mar–Nov it closes only on the 3rd Tue). Alt: Ishii Miso free brewery tour (English tour 13:30)","places":["kaichi"],"mode":"walking"},
