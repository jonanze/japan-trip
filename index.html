w":"☎ 025-228-0101 / Gurunavi online","by":"By late Oct","done":false},{"id":"t21","task":"Book Gyokusendō copper workshop tour: Tue 17 Nov 10:00, 3 people (mention older visitors)","how":"☎ 0256-62-2015 / online form (gyokusendo.com/openfactory)","by":"By late Oct","done":false},{"id":"t08","task":"Reserve Shiseido Parlour Ginza: Sat 21 Nov 19:00 last dinner","how":"Ikyu online / ☎ 03-5537-6241","by":"Early Nov","done":false},{"id":"t22","task":"Book Nezu Museum timed tickets: Thu 19 Nov ~12:45 entry, 3 adults (¥1,600 each online)","how":"e-tix.jp/nezu-muse","by":"Early Nov (when slots open; lead time unverified)","done":false},{"id":"t09","task":"Get International Driving Permits for all drivers","how":"AA Singapore (arrange before you fly)","by":"Before 8 Nov","done":true},{"id":"t10","task":"Confirm Nissan rental car (Nagano pickup 14 Nov) and request an ETC card","how":"Nissan Rent a Car ☎ 026-268-1123","by":"~7 Nov (1 week before)","done":true},{"id":"t11","task":"Reserve Ōgatō Hotel shuttle, both legs (12 Nov up 13:45, 13 Nov down 11:15)","how":"☎ 0263-50-8765 (10:00–19:00)","by":"By 9 Nov (≥3 days before the stay)","done":false},{"id":"t12","task":"Arrange suitcase forwarding: Dormy Inn sends on 10 Nov, Chateraise Hotel Nagano holds until 13 Nov","how":"Dormy ☎ 0263-33-5489 / Chateraise ☎ 026-219-2440 (Yamato TA-Q-BIN at the front desk)","by":"Before 10 Nov","done":false},{"id":"t14","task":"Call Kōshū Hanten: confirm open Tue 17 Nov (monthly Mon–Tue closures)","how":"☎ 0256-64-3770","by":"~14 Nov","done":false},{"id":"t15","task":"Pay Yamanoha night 2 (S$569.22) at the hotel","how":"At Yamanoha","by":"14–16 Nov","done":false},{"id":"t16","task":"Confirm Yahiko Ropeway: no maintenance closure on 16 Nov (optional stop)","how":"☎ 0256-94-4141","by":"Before 16 Nov","done":false},{"id":"t17","task":"Check the Nissan car's height for the Niigata Daiichi garage (max 1.58 m, 1.50 m per Jalan; no reservations; taller cars go to a partner car park)","how":"Nissan ☎ 026-268-1123 / hotel ☎ 025-243-1111","by":"Before 16 Nov (when reconfirming the hotel)","done":false},{"id":"t18","task":"Niigata Daiichi Hotel: future payment on UOB card (S$105.35 + S$72.26)","how":"Agoda booking","by":"Check the due date","done":true},{"id":"t23","task":"Optional: buy Kabuki-za hitomakumi (single-act) seats for Sat 21 Nov; check act times first (published ~1 Nov)","how":"e-tix.jp/shochiku_makumi (credit card, max 4)","by":"Fri 20 Nov, 12:00 JST","done":false},{"id":"t19","task":"Book a large taxi: 21 Nov ~21:40, Mets Kawasaki → Haneda T2 (3 adults + suitcases)","how":"Mets front desk ☎ 044-540-1100, or fixed-fare jumbo via rakurakutaxi.jp (¥20,000 incl. tolls)","by":"By 20 Nov (≥24 h ahead)","done":false}],"contacts":[{"label":"Police (Japan)","tel":"110","note":"Free from any phone"},{"label":"Ambulance or fire (Japan)","tel":"119","note":"Free from any phone"},{"label":"Japan Visitor Hotline (JNTO, English, 24 h)","tel":"050-3816-2787","note":"Help with illness, accidents, lost items, disasters"},{"label":"Embassy of Singapore in Tokyo","tel":"03-3586-9111","note":"5-12-3 Roppongi, Minato-ku"}]}</script>
<script id="app-script">
(function () {
"use strict";
var data = JSON.parse(document.getElementById("trip-data").textContent);

var S = { view: "today", day: null, follow: true };
/* Phone links: in the standalone iPhone app a new-window tel: link leaves a blank Safari page behind; inside the Claude frame it needs one. */
var TEL_TARGET = window.top !== window.self ? ' target="_blank" rel="noopener"' : "";

/* ---------- small helpers ---------- */
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
var ICON = {
  go: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg>',
  taxi: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h6"/></svg>',
  tel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h4l2 5-3 2a12 12 0 0 0 6 6l2-3 5 2v4a2 2 0 0 1-2 2A17 17 0 0 1 3 5a2 2 0 0 1 2-2z"/></svg>',
  map: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.3-7-12a7 7 0 0 1 14 0c0 5.7-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>',
  today: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><circle cx="12" cy="15" r="2" fill="currentColor"/></svg>',
  days: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1.2" fill="currentColor"/><circle cx="4" cy="12" r="1.2" fill="currentColor"/><circle cx="4" cy="18" r="1.2" fill="currentColor"/></svg>',
  bed: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 19V6M3 15h18v4M21 15v-3a3 3 0 0 0-3-3h-7v6"/><circle cx="7" cy="11" r="2"/></svg>',
  todo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M7 10l2 2 4-4M7 16h10"/></svg>',
  help: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>'
};
var KIND = { stay: "Hotel", food: "Meal", visit: "Visit", travel: "Travel", rest: "Rest" };

function jstNow() {
  var parts = {};
  try {
    new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Tokyo", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" })
      .formatToParts(new Date()).forEach(function (p) { parts[p.type] = p.value; });
  } catch (e) { var d = new Date(); return { date: d.toISOString().slice(0, 10), min: d.getHours() * 60 + d.getMinutes() }; }
  return { date: parts.year + "-" + parts.month + "-" + parts.day, min: (+parts.hour % 24) * 60 + (+parts.minute) };
}
function weekday(iso, long) { try { return new Date(iso + "T12:00:00+09:00").toLocaleDateString("en-GB", { weekday: long ? "long" : "short", timeZone: "Asia/Tokyo" }); } catch (e) { return ""; } }
function startMin(t) { var m = /(\d{1,2}):(\d{2})/.exec(t || ""); return m ? (+m[1]) * 60 + (+m[2]) : null; }
function todayIndex() { var d = jstNow().date; for (var i = 0; i < data.days.length; i++) if (data.days[i].date === d) return i; return -1; }
function telHref(n) { var d = String(n).replace(/[^\d+]/g, ""); if (d.charAt(0) === "0" && d.length > 4) d = "+81" + d.slice(1); return "tel:" + d; }
function navUrl(p, mode) {
  var dest = (p.lat && p.lng) ? (p.lat + "," + p.lng) : ((p.ja || p.en) + " " + (p.addr || ""));
  return "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(dest) + "&travelmode=" + (mode || "transit");
}
function mapUrl(p) {
  var q = (p.lat && p.lng) ? (p.lat + "," + p.lng) : ((p.ja || p.en) + " " + (p.addr || ""));
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
}
function place(id) { return data.places[id]; }
function itemMode(day, it) { return it.mode || day.mode || "transit"; }
function nowInfo(dayIdx) {
  var day = data.days[dayIdx], now = jstNow();
  if (!day || day.date !== now.date) return { now: null, next: null };
  var cur = null, nxt = null;
  day.items.forEach(function (it) { var m = startMin(it.time); if (m == null || /^Optional\b/i.test(it.title)) return; if (m <= now.min) cur = it.id; else if (!nxt) nxt = it.id; });
  return { now: cur, next: nxt };
}

/* ---------- rendering ---------- */
function render() {
  var app = document.getElementById("app");
  var h = '<main class="wrap" id="main">';
  if (S.view === "today") h += viewToday();
  else if (S.view === "day") h += viewDay(S.day);
  else if (S.view === "days") h += viewDays();
  else if (S.view === "hotels") h += viewHotels();
  else if (S.view === "todo") h += viewTodo();
  else if (S.view === "help") h += viewHelp();
  h += "</main>";
  h += tabBar();
  app.innerHTML = h;
}
function tabBar() {
  var cur = S.view === "day" ? (S.day === todayIndex() ? "today" : "days") : S.view;
  function t(v, label, ic) { return '<button class="tab" data-act="tab" data-v="' + v + '"' + (cur === v ? ' aria-current="page"' : "") + ">" + ICON[ic] + "<span>" + label + "</span></button>"; }
  return '<nav class="tabs" aria-label="Sections"><div class="tabs-in">' + t("today", "Today", "today") + t("days", "Days", "days") + t("hotels", "Hotels", "bed") + t("todo", "To do", "todo") + t("help", "Help", "help") + "</div></nav>";
}

function viewToday() {
  var i = todayIndex(), now = jstNow(), first = data.days[0];
  if (i >= 0) return viewDay(i);
  var h = "";
  if (now.date < first.date) {
    var n = Math.round((new Date(first.date + "T00:00:00Z") - new Date(now.date + "T00:00:00Z")) / 864e5);
    h += '<div class="note"><b>Trip starts in ' + n + (n === 1 ? " day" : " days") + "</b>" + esc(weekday(first.date, true)) + " " + esc(first.label) + "</div>";
    return h + viewDay(0, true);
  }
  return viewDays(true);
}

function viewDay(i, embedded) {
  var day = data.days[i]; if (!day) return "";
  var prev = data.days[i - 1], next = data.days[i + 1], ni = nowInfo(i);
  var h = '<section class="sign" aria-label="Day ' + (i + 1) + '">' +
    '<div class="sign-top"><span>Day ' + (i + 1) + " of " + data.days.length + "</span><span>" + esc(weekday(day.date)) + " " + esc(day.label) + "</span></div>" +
    '<div class="sign-mid"><div class="sign-kanji" lang="ja">' + esc(day.ja) + '</div><div class="sign-romaji">' + esc(day.en) + '</div><div class="sign-sub">' + esc(day.sub) + "</div></div>" +
    '<div class="sign-rail"><button data-act="goday" data-i="' + (i - 1) + '"' + (prev ? "" : " disabled") + ' aria-label="Previous day">◀ <span>' + (prev ? esc(prev.label) + "<small>" + esc(prev.en) + "</small>" : "Start") + "</span></button>" +
    '<button class="nx" data-act="goday" data-i="' + (i + 1) + '"' + (next ? "" : " disabled") + ' aria-label="Next day"><span>' + (next ? esc(next.label) + "<small>" + esc(next.en) + "</small>" : "End") + "</span> ▶</button></div></section>";
  if (day.hotel && place(day.hotel)) {
    var hp = place(day.hotel);
    var hm = day.mode || "transit";
    day.items.forEach(function (it) { if (it.kind === "stay" && (it.places || []).indexOf(day.hotel) >= 0) hm = itemMode(day, it); });
    h += '<div class="tonight"><div class="eyebrow">Tonight’s hotel</div><h3>' + esc(hp.en) + '</h3><div class="place-ja">' + esc(hp.ja) + "</div>" + placeButtons(day.hotel, hm, true) + "</div>";
  }
  h += '<ol class="list">';
  day.items.forEach(function (it, k) { h += card(day, i, it, k, ni); });
  h += "</ol>";
  return h;
}

function card(day, di, it, k, ni) {
  var isNow = ni.now === it.id, isNext = !ni.now && ni.next === it.id;
  var mode = itemMode(day, it);
  var h = '<li class="card' + (isNow || isNext ? " is-now" : "") + '" id="c-' + it.id + '"><div class="card-head"><span class="time">' + esc(it.time) + '</span><span class="kind k-' + esc(it.kind) + '">' + esc(KIND[it.kind] || "Stop") + "</span>" +
    (isNow ? '<span class="nowtag">Now</span>' : isNext ? '<span class="nowtag">Next</span>' : "") + "</div>" +
    "<h3>" + esc(it.title) + "</h3>";
  var lede = (it.how || "").split("\n")[0];
  if (lede) h += '<p class="lede">' + esc(lede) + "</p>";
  var many = (it.places || []).length > 1;
  (it.places || []).forEach(function (pid) { if (place(pid)) h += '<div class="place">' + (many ? '<div class="place-name">' + esc(place(pid).en) + "</div>" : "") + '<div class="place-ja">' + esc(place(pid).ja) + "</div>" + placeButtons(pid, mode, false) + "</div>"; });
  h += details(it, mode);
  return h + "</li>";
}

function placeButtons(pid, mode, isHotel) {
  var p = place(pid);
  var h = '<div class="btns"><a class="btn go" href="' + esc(navUrl(p, mode)) + '" target="_blank" rel="noopener">' + ICON.go + "Directions</a>" +
    '<button class="btn" data-act="taxi" data-p="' + esc(pid) + '"' + (isHotel ? ' data-hotel="1"' : "") + ">" + ICON.taxi + "Show taxi driver</button>";
  if (p.tel) h += '<a class="btn small" href="' + esc(telHref(p.tel)) + '"' + TEL_TARGET + '>' + ICON.tel + esc(p.tel) + "</a>";
  h += "</div>";
  if (p.mc && (mode === "driving" || isHotel)) h += mcRow(p.mc);
  return h;
}
function mcRow(mc) {
  return '<div class="mc">Mapcode <code>' + esc(mc) + '</code><button class="btn small" data-act="copy" data-t="' + esc(mc) + '">Copy</button></div>';
}

function details(it, mode) {
  var parts = "";
  if (it.how) parts += "<div><h4>Getting there and where</h4>" + paras(it.how) + "</div>";
  if (it.notes) parts += "<div><h4>" + (/^~?\d{1,2}:\d{2}/m.test(it.notes) ? "Step by step" : "Good to know") + "</h4>" + paras(it.notes) + "</div>";
  var extra = "";
  (it.places || []).forEach(function (pid) {
    var p = place(pid); if (!p) return;
    extra += '<p><b>' + esc(p.en) + '</b><br><span class="ja">' + esc(p.addr) + "</span>" + (p.mc && mode !== "driving" ? "<br>Mapcode " + esc(p.mc) : "") +
      '<br><a href="' + esc(mapUrl(p)) + '" target="_blank" rel="noopener">Open on the map</a></p>';
  });
  if (extra) parts += "<div><h4>Addresses</h4>" + extra + "</div>";
  if (!parts) return "";
  return '<details class="more"><summary>More details</summary><div class="dl">' + parts + "</div></details>";
}
function paras(txt) {
  var lines = String(txt).split("\n"), out = "", steps = [];
  function flush() { if (steps.length) { out += '<ul class="steps">' + steps.join("") + "</ul>"; steps = []; } }
  lines.forEach(function (l) {
    var m = /^(~?\d{1,2}:\d{2}(?:[–-]~?\d{1,2}:\d{2})?)\s+(.*)$/.exec(l);
    if (m) steps.push("<li><b>" + esc(m[1]) + "</b><span>" + esc(m[2]) + "</span></li>");
    else if (l.trim()) { flush(); out += "<p>" + esc(l) + "</p>"; }
  });
  flush();
  return out;
}

function viewDays(embedded) {
  var t = todayIndex();
  var h = embedded ? "" : '<h2 class="page">All days</h2>';
  h += '<ul class="daylist">';
  data.days.forEach(function (d, i) {
    h += '<li><button class="dayrow' + (i === t ? " today" : "") + '" data-act="goday" data-i="' + i + '"><span class="d">' + esc(d.label) + "<small>" + esc(weekday(d.date)) + "</small></span>" +
      '<span class="t"><b>' + esc(d.en) + "</b><span>" + esc(d.sub) + '</span></span><span class="kj" lang="ja">' + esc(d.ja) + "</span></button></li>";
  });
  return h + "</ul>";
}

function hotelStays() {
  var stays = [];
  data.days.forEach(function (d) {
    if (!d.hotel) return;
    var last = stays[stays.length - 1];
    if (last && last.id === d.hotel) last.nights++; else stays.push({ id: d.hotel, from: d, nights: 1 });
  });
  return stays;
}
function viewHotels() {
  var h = '<h2 class="page">Hotels</h2>';
  hotelStays().forEach(function (s) {
    var p = place(s.id); if (!p) return;
    h += '<div class="hotel"><div class="eyebrow">' + esc(weekday(s.from.date)) + " " + esc(s.from.label) + " · " + s.nights + (s.nights > 1 ? " nights" : " night") + "</div><h3>" + esc(p.en) + '</h3><div class="addr">' + esc(p.ja) + "<br>" + esc(p.addr) + "</div>" + placeButtons(s.id, "transit", true) + "</div>";
  });
  return h;
}

var PHRASES = [
  ["トイレはどこですか？", "Where is the toilet?"],
  ["このホテルに帰りたいです。", "I want to go back to this hotel."],
  ["病院に連れて行ってください。", "Please take me to a hospital."],
  ["助けてください。", "Please help me."],
  ["道に迷いました。", "I am lost."],
  ["英語を話せる人はいますか？", "Does anyone speak English?"],
  ["カードで払えますか？", "Can I pay by card?"]
];
function viewHelp() {
  var h = '<h2 class="page">Help</h2>';
  h += '<section class="block"><h3>Emergency</h3><div class="sos">';
  data.contacts.forEach(function (c, k) {
    h += '<a href="' + esc(telHref(c.tel)) + '"' + TEL_TARGET + '><span><b>' + esc(c.label) + "</b><small>" + esc(c.note) + '</small></span><span class="num">' + esc(c.tel) + "</span></a>";
  });
  h += "</div></section>";
  h += '<section class="block"><h3>Phrases</h3><div class="phrases">';
  PHRASES.forEach(function (p, k) { h += '<button class="phrase" data-act="phrase" data-k="' + k + '"><span class="ja" lang="ja">' + esc(p[0]) + "</span><small>" + esc(p[1]) + "</small></button>"; });
  h += "</div></section>";
  h += '<p class="pagesub updated">Updated ' + esc(data.updated) + "</p>";
  return h;
}

function viewTodo() {
  var open = data.todo.filter(function (t) { return !t.done; }), done = data.todo.filter(function (t) { return t.done; });
  function row(t) {
    return '<li class="' + (t.done ? "done" : "") + '"><span class="box" aria-hidden="true">' + (t.done ? "✓" : "") + '</span><span><span class="tt">' + esc(t.task) + "</span>" +
      (t.done ? "" : '<span class="by">By: ' + esc(t.by) + "</span>") + "<small>" + esc(t.how) + "</small></span></li>";
  }
  var h = '<h2 class="page">To do</h2>';
  h += '<ul class="todo">' + open.map(row).join("") + "</ul>";
  if (done.length) h += '<section class="block"><h3>Done</h3><ul class="todo">' + done.map(row).join("") + "</ul></section>";
  return h;
}

/* ---------- overlays ---------- */
function openLayer(html) { var l = document.getElementById("layer"); l.innerHTML = '<div class="overlay" role="dialog" aria-modal="true"><div class="overlay-in">' + html + "</div></div>"; var f = l.querySelector("button, input"); if (f) f.focus(); }
function closeLayer() { document.getElementById("layer").innerHTML = ""; }
function taxiCard(pid, hotel) {
  var p = place(pid); if (!p) return;
  openLayer('<div class="taxi" lang="ja"><div class="ask">' + (hotel ? "このホテルまでお願いします。" : "ここまでお願いします。") + '</div><div class="tname">' + esc(p.ja) + '</div><div class="taddr">' + esc(p.addr) + "</div>" +
    (p.tel ? '<div class="tline">電話 ' + esc(p.tel) + "</div>" : "") + (p.mc ? '<div class="tline">マップコード <span>' + esc(p.mc) + "</span></div>" : "") +
    '<div class="en" lang="en">' + (hotel ? "“Please take me to this hotel.” " : "“Please take me here.” ") + esc(p.en) + "</div></div>" +
    '<div class="btns"><a class="btn go" href="' + esc(navUrl(p, "driving")) + '" target="_blank" rel="noopener">' + ICON.go + 'Directions</a><button class="btn" data-act="close">Close</button></div>');
}
function phraseCard(k) {
  var p = PHRASES[k];
  openLayer('<div class="taxi"><div class="bigphrase" lang="ja">' + esc(p[0]) + '</div><div class="en">' + esc(p[1]) + '</div></div><div class="btns"><button class="btn" data-act="close">Close</button></div>');
}
function toast(msg) { var t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 3200); }


/* ---------- events ---------- */
document.addEventListener("click", function (ev) {
  var b = ev.target.closest("[data-act]"); if (!b) return;
  var a = b.getAttribute("data-act"), i = +b.getAttribute("data-i"), k = +b.getAttribute("data-k");
  if (a === "copy") {
    var txt = b.getAttribute("data-t");
    var done = function () { toast("Copied " + txt); };
    try { navigator.clipboard.writeText(txt).then(done, function () { selectNear(b); }); } catch (e) { selectNear(b); }
    return;
  }
  if (b.tagName === "A") return;
  ev.preventDefault();
  switch (a) {
    case "tab": S.view = b.getAttribute("data-v"); S.follow = S.view === "today"; if (S.view === "today" && todayIndex() >= 0) { S.view = "day"; S.day = todayIndex(); } render(); scrollTop(); if (S.view === "day") scrollToNow(); break;
    case "goday": if (data.days[i]) { S.view = "day"; S.day = i; S.follow = false; render(); scrollTop(); scrollToNow(); } break;
    case "taxi": taxiCard(b.getAttribute("data-p"), b.getAttribute("data-hotel") === "1"); break;
    case "phrase": phraseCard(k); break;
    case "close": closeLayer(); break;
  }
});
document.addEventListener("keydown", function (ev) { if (ev.key === "Escape" && document.getElementById("layer").innerHTML) closeLayer(); });

function selectNear(b) { var code = b.parentNode.querySelector("code"); if (!code) return; var r = document.createRange(); r.selectNodeContents(code); var s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Selected. Use your phone’s Copy."); }
function scrollTop() { try { window.scrollTo(0, 0); } catch (e) {} }
function scrollToNow() { var el = document.querySelector(".card.is-now"); if (el) setTimeout(function () { el.scrollIntoView({ block: "center" }); }, 60); }

/* ---------- start ---------- */
if (todayIndex() >= 0) { S.view = "day"; S.day = todayIndex(); }
var hash = (location.hash || "").replace("#", "");
if (/^day\d{1,2}$/.test(hash) && data.days[+hash.slice(3) - 1]) { S.view = "day"; S.day = +hash.slice(3) - 1; S.follow = false; }
else if (["days", "hotels", "todo", "help"].indexOf(hash) >= 0) { S.view = hash; S.follow = false; }
render(); scrollToNow();
/* Keep "Today" current: refresh Now/Next, and move to the new day after midnight or when the app is reopened from the background. */
function refresh() {
  if (document.getElementById("layer").innerHTML) return;
  var t = todayIndex();
  if (S.follow && t >= 0 && !(S.view === "day" && S.day === t)) { S.view = "day"; S.day = t; render(); scrollTop(); scrollToNow(); return; }
  if (S.view === "day" && S.day === t) { var y = window.scrollY; render(); window.scrollTo(0, y); }
}
setInterval(refresh, 120000);
document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") refresh(); });

})();
</script>
