<style id="app-style">
/* Layout: one day per screen, styled like a JR station nameplate (kanji, romaji, previous / next stop),
   then a single column of large stop cards; fixed bottom bar with five big tabs. */
:root {
  --bg: #f3f5f9;
  --surface: #ffffff;
  --ink: #0f1629;
  --muted: #434d63;
  --line: #cfd6e3;
  --ai: #1d3a8f;
  --ai-ink: #ffffff;
  --ai-soft: #e3e9f8;
  --go: #0a6b38;
  --go-ink: #ffffff;
  --warn: #7a4300;
  --warn-bg: #fff0d6;
  --now: #b3261e;
  --now-bg: #fdecea;
  --k-stay: #5a3ea6;
  --k-food: #9b3a12;
  --k-visit: #17695a;
  --k-travel: #36435c;
  --shadow: 0 1px 2px rgba(15,22,41,.08), 0 2px 8px rgba(15,22,41,.06);
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-ja: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  --fs: 20px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c111d; --surface: #161e31; --ink: #f2f4f9; --muted: #b9c1d4; --line: #2c3753;
    --ai: #9db2ff; --ai-ink: #0c111d; --ai-soft: #1f2a48; --go: #33b46c; --go-ink: #04150b;
    --warn: #ffcf86; --warn-bg: #3a2a10; --now: #ff8a80; --now-bg: #3d1a19;
    --k-stay: #c3b1ff; --k-food: #ffb08c; --k-visit: #79d8c3; --k-travel: #c2cbe0;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c111d; --surface: #161e31; --ink: #f2f4f9; --muted: #b9c1d4; --line: #2c3753;
  --ai: #9db2ff; --ai-ink: #0c111d; --ai-soft: #1f2a48; --go: #33b46c; --go-ink: #04150b;
  --warn: #ffcf86; --warn-bg: #3a2a10; --now: #ff8a80; --now-bg: #3d1a19;
  --k-stay: #c3b1ff; --k-food: #ffb08c; --k-visit: #79d8c3; --k-travel: #c2cbe0;
  --shadow: none; color-scheme: dark;
}
html { font-size: var(--fs); }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 1rem; line-height: 1.45; -webkit-text-size-adjust: 100%; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--ai); }
:focus-visible { outline: 3px solid var(--ai); outline-offset: 2px; }
.ja { font-family: var(--f-ja); }
.wrap { max-width: 40rem; margin: 0 auto; padding-inline: 16px; padding-block: 0 7.5rem; }

/* Station sign */
.sign { margin-top: 1rem; background: var(--surface); border: 3px solid var(--ink); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
.sign-top { background: var(--ai); color: var(--ai-ink); padding: .35rem .9rem; font-weight: 700; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; display: flex; justify-content: space-between; gap: .5rem; flex-wrap: wrap; }
.sign-mid { text-align: center; padding: .7rem .8rem .5rem; }
.sign-kanji { font-family: var(--f-ja); font-weight: 700; font-size: 2.6rem; line-height: 1.1; letter-spacing: .06em; }
.sign-romaji { font-weight: 700; font-size: 1.25rem; margin-top: .15rem; }
.sign-sub { color: var(--muted); font-size: .95rem; margin-top: .35rem; text-wrap: balance; }
.sign-rail { display: grid; grid-template-columns: 1fr 1fr; border-top: 6px solid var(--ai); }
.sign-rail button { min-height: 3.4rem; border: 0; background: var(--ai-soft); cursor: pointer; font-weight: 700; font-size: .9rem; padding: .3rem .7rem; display: flex; align-items: center; gap: .35rem; min-width: 0; }
.sign-rail button:disabled { opacity: .35; cursor: default; }
.sign-rail .nx { justify-content: flex-end; text-align: right; border-left: 2px solid var(--surface); }
.sign-rail span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sign-rail small { display: block; font-weight: 400; font-size: .7rem; color: var(--muted); }

/* Notices */
.note { margin-top: 1rem; padding: .8rem 1rem; border-radius: 10px; background: var(--ai-soft); font-size: .95rem; }
.note b { display: block; font-size: 1.05rem; }

/* Tonight */
.tonight { margin-top: 1rem; background: var(--surface); border: 2px solid var(--k-stay); border-radius: 12px; padding: .8rem 1rem 1rem; }
.eyebrow { font-size: .75rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.tonight h3 { margin: .1rem 0 .1rem; font-size: 1.2rem; }

/* Stop cards */
.list { list-style: none; margin: 1rem 0 0; padding: 0; display: grid; gap: .9rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: .9rem 1rem 1rem; box-shadow: var(--shadow); min-width: 0; }
.card.is-now { border: 3px solid var(--now); }
.card-head { display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap; }
.time { font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.kind { font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: .15rem .5rem; border-radius: 6px; border: 2px solid currentColor; }
.k-stay { color: var(--k-stay); } .k-food { color: var(--k-food); } .k-visit { color: var(--k-visit); } .k-travel, .k-rest { color: var(--k-travel); }
.nowtag { margin-left: auto; background: var(--now); color: var(--surface); font-weight: 700; font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; padding: .2rem .55rem; border-radius: 6px; }
.card h3 { margin: .35rem 0 0; font-size: 1.15rem; line-height: 1.3; text-wrap: balance; }
.lede { color: var(--muted); margin: .3rem 0 0; font-size: .95rem; }
.place { margin-top: .8rem; padding-top: .7rem; border-top: 1px dashed var(--line); }
.place:first-of-type { border-top: 0; padding-top: 0; }
.place-name { font-weight: 700; }
.place-ja { font-family: var(--f-ja); color: var(--muted); font-size: .9rem; }
.btns { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .55rem; }
.btn { flex: 1 1 9rem; min-height: 3.3rem; display: inline-flex; align-items: center; justify-content: center; gap: .45rem; padding: .4rem .9rem; border-radius: 10px; font-weight: 700; font-size: 1rem; text-decoration: none; cursor: pointer; border: 2px solid var(--ink); background: var(--surface); color: var(--ink); text-align: center; line-height: 1.15; }
.btn svg { width: 1.3em; height: 1.3em; flex: none; }
.btn.go { background: var(--go); border-color: var(--go); color: var(--go-ink); }
.btn.small { flex: 0 1 auto; min-height: 2.8rem; font-size: .9rem; }
.mc { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; margin-top: .55rem; font-size: .9rem; }
.mc code { font-family: var(--f-body); font-weight: 700; font-size: 1.1rem; font-variant-numeric: tabular-nums; background: var(--ai-soft); padding: .15rem .5rem; border-radius: 6px; user-select: all; }
details.more { margin-top: .8rem; }
details.more > summary { min-height: 2.8rem; display: flex; align-items: center; gap: .4rem; cursor: pointer; font-weight: 700; color: var(--ai); list-style: none; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::before { content: "+"; display: inline-grid; place-items: center; width: 1.6rem; height: 1.6rem; border-radius: 50%; border: 2px solid currentColor; font-size: 1rem; }
details.more[open] > summary::before { content: "−"; }
.dl { display: grid; gap: .7rem; font-size: .95rem; }
.dl h4 { margin: 0 0 .2rem; font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.dl p { margin: 0 0 .35rem; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: .3rem; }
.steps li { display: grid; grid-template-columns: 5.2rem 1fr; gap: .5rem; }
.steps b { font-variant-numeric: tabular-nums; }

/* Lists: all days, hotels, help */
h2.page { font-size: 1.5rem; margin: 1.2rem 0 .2rem; }
.pagesub { color: var(--muted); margin: 0 0 1rem; }
.daylist { list-style: none; margin: 0; padding: 0; display: grid; gap: .6rem; }
.dayrow { width: 100%; display: grid; grid-template-columns: 4.2rem minmax(0, 1fr) auto; align-items: center; gap: .8rem; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: .7rem .9rem; cursor: pointer; min-height: 4.4rem; }
.dayrow.today { border: 3px solid var(--now); }
.dayrow .d { font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.dayrow .d small { display: block; font-weight: 400; color: var(--muted); font-size: .8rem; }
.dayrow .t { min-width: 0; }
.dayrow .t b { display: block; overflow-wrap: anywhere; }
.dayrow .t span { color: var(--muted); font-size: .9rem; }
.dayrow .kj { font-family: var(--f-ja); font-weight: 700; font-size: 1.1rem; color: var(--ai); }
.hotel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: .9rem 1rem 1rem; }
.hotel + .hotel { margin-top: .9rem; }
.hotel h3 { margin: .1rem 0; font-size: 1.2rem; }
.addr { font-family: var(--f-ja); font-size: .95rem; margin-top: .3rem; }
.sos { display: grid; gap: .6rem; }
.sos a, .sos .row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: .2rem .8rem; padding: .8rem 1rem; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; text-decoration: none; color: var(--ink); }
.sos .num { font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--now); white-space: nowrap; }
.sos small { display: block; color: var(--muted); font-size: .85rem; }
.phrases { display: grid; gap: .6rem; }
.phrase { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: .8rem 1rem; cursor: pointer; }
.phrase .ja { display: block; font-size: 1.3rem; font-weight: 700; }
.phrase small { color: var(--muted); }
.todo { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; }
.todo li { display: grid; grid-template-columns: 2rem minmax(0, 1fr); gap: .6rem; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: .6rem .8rem; font-size: .92rem; }
.todo li.done .tt { text-decoration: line-through; color: var(--muted); }
.todo .box { width: 1.5rem; height: 1.5rem; margin-top: .1rem; border: 2px solid var(--muted); border-radius: 5px; display: grid; place-items: center; font-weight: 700; line-height: 1; }
.todo li.done .box { background: var(--go); border-color: var(--go); color: var(--go-ink); }
.todo .by { display: block; font-weight: 700; color: var(--warn); font-size: .85rem; margin-top: .15rem; }
.todo small { display: block; color: var(--muted); }
.todo li > span:last-child { min-width: 0; overflow-wrap: anywhere; }
section.block { margin-top: 1.6rem; }
section.block > h3 { font-size: 1.15rem; margin: 0 0 .6rem; }
.pagesub.updated { margin-top: 1.6rem; font-size: .85rem; }

/* Bottom tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 2px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs-in { max-width: 40rem; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
.tab { min-height: 4.2rem; border: 0; background: none; cursor: pointer; display: grid; place-items: center; align-content: center; gap: .15rem; font-weight: 700; font-size: .8rem; color: var(--muted); padding: .3rem 0; }
.tab svg { width: 1.6rem; height: 1.6rem; }
.tab[aria-current="page"] { color: var(--ai); box-shadow: inset 0 4px 0 var(--ai); }

/* Overlays: taxi card, phrases */
.overlay { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; padding: calc(env(safe-area-inset-top, 0px) + 1rem) 16px calc(env(safe-area-inset-bottom, 0px) + 1.5rem); }
.overlay-in { max-width: 40rem; margin: 0 auto; }
.taxi { background: #ffffff; color: #000000; border: 4px solid #000000; border-radius: 14px; padding: 1.2rem 1rem; }
.taxi .ask { font-family: var(--f-ja); font-size: 1.35rem; font-weight: 700; }
.taxi .tname { font-family: var(--f-ja); font-size: 2.3rem; font-weight: 700; line-height: 1.2; margin: .6rem 0 .4rem; word-break: break-word; }
.taxi .taddr { font-family: var(--f-ja); font-size: 1.5rem; line-height: 1.4; word-break: break-word; }
.taxi .tline { font-family: var(--f-ja); font-size: 1.2rem; margin-top: .6rem; }
.taxi .tline span { white-space: nowrap; }
.taxi .en { font-family: var(--f-body); font-size: .9rem; color: #333333; margin-top: .8rem; border-top: 1px solid #999999; padding-top: .6rem; }
.bigphrase { font-family: var(--f-ja); font-size: 2.4rem; font-weight: 700; line-height: 1.3; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 5.5rem); z-index: 30; background: var(--ink); color: var(--bg); padding: .7rem 1rem; border-radius: 10px; font-weight: 700; max-width: calc(100% - 32px); box-shadow: 0 4px 16px rgba(0,0,0,.25); }
@media (max-width: 380px) { .sign-kanji { font-size: 2.1rem; } .tab { font-size: .72rem; } .steps li { grid-template-columns: 4.4rem 1fr; } }
@media (prefers-reduced-motion: no-preference) { .card.is-now { animation: pulse 2s ease-out 1; } @keyframes pulse { from { box-shadow: 0 0 0 6px var(--now-bg); } to { box-shadow: var(--shadow); } } }

 Airport T2, international area. ANA shows the expected arrival terminal on its flight-status page 2 days before and confirms it 2 h before landing","notes":"Immigration, baggage and customs (fill in Visit Japan Web first for the QR codes). Add Suica to your phone wallet before flying, so there is no card queue","places":["haneda_t2","haneda"]},{"id":"i04","time":"07:45–12:37","title":"Transit · Haneda → Shinjuku → Matsumoto (Ltd Exp Azusa 13)","kind":"travel","how":"Airport Limousine bus T2 → Shinjuku Sta West Exit (Keiō Dept Store), ¥1,400 pp, 07:45 → 08:20 timetabled (allow 60–70 min on a Monday morning). The bus starts at T3 and calls at T2 10 min later\nLtd Exp Azusa 13: Shinjuku 10:00 → Matsumoto 12:37 (reserved seats, ~¥6,700 pp). Booked on the later train so Monday traffic can't make you miss it","notes":"05:55 Land at T2\n06:00–07:00 Immigration, bags, customs\n07:00–07:35 Seven Bank ATM for ¥ (T2 2F Welcome Center, 06:00–23:00), toilets; then down to 1F for bus tickets (Limousine ticket machines / counter) and the bus stop outside\n07:45 Bus from T2 (take the 07:25 if out early); bags go under the bus\n08:20–08:55 Shinjuku West Exit (08:20 timetabled; later in Monday traffic); 5–10 min walk to the JR gates\nAt Shinjuku by ~08:35: change to Azusa 9 (09:00 → 11:39) at a reserved-seat machine (one free change, if seats remain)\nOtherwise: print the Azusa 13 tickets (QR from the booking), sit down for coffee or breakfast near the gates, on the platform by 09:50\n10:00 Depart\n12:37 Matsumoto; 5 min walk to Dormy Inn\nOut by ~06:45: 06:55 bus, try to change to Azusa 5 (08:00 → 10:37)\nIf you land at T3 instead: same buses 10 min earlier (06:45 / 07:15 / 07:35 / 08:05); Seven Bank ATM and Limousine counter are in the T3 arrivals hall, 2F; the plan holds\nRail alt (~¥540 pp): Keikyū from Haneda T1·T2 Sta → Shinagawa → JR Yamanote Line → Shinjuku, ~45 min, but Monday rush hour with suitcases\nTaxi alt: fixed fare ~¥9,000 + tolls per car to Shinjuku","places":["shinjuku","mmstn"],"action":"★ Reserve Azusa 13 seats on eki-net (opens 9 Oct, 10:00 JST)"},{"id":"i05","time":"12:45","title":"Drop bags · Dormy Inn Matsumoto (1 nt)","kind":"stay","how":"Dormy Inn Matsumoto, 2-2-1 Fukashi, Matsumoto 〒390-0815 (☎ 0263-33-5489)\n5 min walk from JR Matsumoto Sta\nMC 75 821 318*64","notes":"Drop bags on arrival; check in properly later. Natural onsen; breakfast incl.; 2 rooms","places":["dormy"],"mode":"walking","action":"Future payment 6 Nov (S$)"},{"id":"i06","time":"13:00","title":"Lunch · Sobakiri Miyota (toji-soba)","kind":"food","how":"Gokō Honmachi Bldg 1F, 2-1-24 Chūō, Matsumoto; 5 min walk from the station and Dormy Inn","notes":"Tabelog 3.49; Matsumoto's toji-soba (soba dipped shabu-style in hot sansai broth). Kitchen L.O. 14:30 sharp and it can sell out, so go straight from the station (drop bags after lunch if the train runs late). Closed Thu. Backup: Kurekino, station bldg 1F (all-day soba, Tabelog 3.49)","places":["miyota_m"],"mode":"walking"},{"id":"i07","time":"~14:15","title":"Former Kaichi School (旧開智学校), National Treasure","kind":"visit","how":"2-4-12 Kaichi, Matsumoto 〒390-0876\n~20–25 min walk from Dormy Inn via Nawate-dōri (or Town Sneaker North bus)","notes":"Reopened Nov 2024 after a 3-year seismic retrofit. 09:00–17:00 (last entry 16:30), ¥700 at the window or ¥600 by e-ticket. Open Mon 9 Nov (Mar–Nov it closes only on the 3rd Tue, i.e. 17 Nov). Alt: Ishii Miso free brewery tour","places":["kaichi"],"mode":"walking"},{"id":"i08","time":"~15:30","title":"Stroll · Nawate-dōri ('Frog Street') and Nakamachi","kind":"visit","how":"Nawate-dōri (Ōte 4-chōme) ↔ Nakamachi; ~10 min walk from Dormy Inn\nMC 75 821 687*34","notes":"Antique stalls, cafés, kura storehouses; flat and walkable. Café: Coffee Bigaku Abe, 1-2-8 Fukashi (Tabelog 3.64; 1957 jun-kissa, mocha parfait; until 16:30, so go there first). The famous Marumo is closed Mon. All-day alt: Kamenoya beside Nawate-dōri (until 20:00, no closing day). Souvenir sweets: Kaiundō Honten, 2-2-15 Chūō on Honmachi-dōri next to Nakamachi (09:00–18:00, closed only 1 Jan; 'Hakuchō no Mizuumi'; small tea room inside)","places":["nawate","nakamachi","abe"],"mode":"walking"},{"id":"i09","time":"~18:30","title":"Dinner · Matsumoto Karaage Center; then hotel onsen","kind":"food","how":"MIDORI Matsumoto 4F, 1-1-1 Fukashi (station bldg, 2 min from Dormy Inn)","notes":"Sanzoku-yaki (garlic-soy fried chicken), national karaage-award winner, Tabelog 3.46, teishoku. ⚠ L.O. 19:30, so sit down by 19:00. Backup: Katsugen tonkatsu honten (Tabelog 3.43, 4-9-7 Ōte, L.O. 20:00). Hotel onsen open late. Dormy Inn serves free late-night 'yonaki soba' (light ramen) 21:30–23:00 in the 1F restaurant (confirm at the desk)","places":["karaage"],"mode":"walking"}]},{"date":"2026-11-10","label":"10 Nov","ja":"上高地","en":"Kamikochi","sub":"Train and bus up to Kamikochi","mode":"transit","hotel":"parklodge","items":[{"id":"i10","time":"08:15","title":"Check out · Dormy Inn Matsumoto; forward suitcases","kind":"travel","how":"Matsumoto","notes":"Forward the big suitcases to Chateraise Hotel Nagano for 13 Nov (Yamato TA-Q-BIN from the Dormy front desk, ~¥2–3k per bag, unverified); carry day packs for 3 nights (Kamikochi 2, Ōgatō 1). Lunch today is at Kamonji-goya (Myōjin), but buy onigiri as a backup in case it has sold out (Ekiben Azusa inside the JR gates, or a station-bldg bakery)","places":["dormy"],"action":"★ Ask Dormy Inn to send and Chateraise to hold the suitcases until 13 Nov"},{"id":"i11","time":"08:43–~10:35","title":"Transit · Matsumoto → Kamikochi (Kamikochi Line + Alpico bus)","kind":"travel","how":"Matsumoto Dentetsu Kamikochi Line: Matsumoto 08:43 → Shin-Shimashima 09:14 (¥710)\nAlpico bus: Shin-Shimashima 09:30 → Kamikochi Bus Terminal ~10:35 (¥3,100 one way)","notes":"08:25 Walk to the Kamikochi Line platform (inside JR Matsumoto Sta); buy train tickets\n08:43 Train (~31 min)\n09:14 Shin-Shimashima; bus stop at the station, show the bus reservation (16 min to change)\n09:30 Bus (~65 min)\n~10:35 Kamikochi Bus Terminal; 5 min walk to the lodge\nThe earlier bus gets you to Kamonji-goya at Myōjin well before its last lunch of the season (10 Nov, L.O. 14:00)\nLater: 09:24 train → 10:05 bus → ~11:10 (still workable, ~35 min less margin)\nTimetable valid 17 Apr–15 Nov 2026 (Alpico)","places":["mmstn","shinshima","kkbus"],"action":"★ Reserve the 09:30 Shin-Shimashima bus ~1 month ahead (≈10 Oct, from 00:00 JST); reserved passengers board first"},{"id":"i12","time":"~10:45","title":"Check in · The Parklodge Kamikochi (2 nt)","kind":"stay","how":"The Parklodge Kamikochi, 4468 Azumi Kamikochi, Matsumoto 〒390-1516 (☎ 0263-95-2221)\nCar-free valley (no MC); 5 min from Kamikochi Bus Terminal, 1 min to Kappa Bridge","notes":"Arrive ~10:45 to leave bags; rooms from 15:00. Breakfast + dinner incl.","places":["parklodge"],"mode":"walking","action":"Paid via Utrip"},{"id":"i13","time":"~11:00–14:45","title":"Walk · Kappa Bridge → Myōjin Pond + lunch at Kamonji-goya","kind":"visit","how":"Kappa Bridge (1 min from the lodge) → left bank to Myōjin, 2.5 km (~50 min; allow 65) → back by the right bank, 3.0 km (~60–75 min)\nKamonji-goya (嘉門次小屋), beside Myōjin Pond, Azumi Kamikochi, Matsumoto 〒390-1516 (☎ 0263-95-2418)\nCar-free valley (no MC)","notes":"11:00 Kappa Bridge; Mt Hotaka view\n~12:05 Kamonji-goya: grilled iwana set ¥2,300 (iwana alone ¥1,500). 10 Nov is its last day of the 2026 season; food 10:00–14:00 (L.O. 14:00), no reservations, iwana can sell out (then eat the backup onigiri)\n~12:50 Myōjin Pond (Hotaka Shrine Okumiya), ¥500\n~13:15 Back by the right bank (no toilet on this bank; use the ones at Myōjin)\n~14:30 Kappa Bridge; Kamikochi Visitor Center (free, 08:00–17:00)\n~5.5 km, flat. If EH & BY are tired after the flight, they can stay at Kappa Bridge and the Visitor Center\nIf wet: light rain is fine on this flat path, and today is Kamonji-goya's last day. In heavy rain, shorten to Kappa Bridge → Weston Relief → Visitor Center and eat at the lodge or the terminal","places":["kappa","kamonji","myojin"],"mode":"walking"},{"id":"i14","time":"~18:00","title":"Dinner · The Parklodge","kind":"food","how":"The Parklodge Kamikochi","notes":"Included; confirm the dinner slot at check-in","places":["parklodge"],"mode":"walking"}]},{"date":"2026-11-11","label":"11 Nov","ja":"上高地","en":"Kamikochi","sub":"Easy pond walk in the valley","mode":"walking","hotel":"parklodge","items":[{"id":"i15","time":"08:15–~11:30","title":"Walk · Taishō Pond → Tashiro Pond → Imperial Hotel tea → Kappa Bridge","kind":"visit","how":"Sawando shuttle (Alpico): Kamikochi Bus Terminal 07:50, 08:15 or 08:45 → Taishō-ike ~7 min later (no reservation, first-come; ~¥350, unverified)\nKamikochi Imperial Hotel (上高地帝国ホテル), Grindelwald lounge, Azumi Kamikochi, Matsumoto 〒390-1516 (☎ 0263-95-2001); open to non-guests; hotel season to 14 Nov\nCar-free valley (no MC)","notes":"08:15 or 08:45 Shuttle → Taishō-ike; Mt Hotaka reflected in the pond\nWalk back via Tashiro Pond to the Kamikochi Imperial Hotel (roughly halfway, estimate)\nTea or cake at the Grindelwald lounge (tea 09:00–16:30, cake sets from 10:00; price unverified)\nOn past the Weston Relief to Kappa Bridge; back ~11:30\n~4 km in total on flat boardwalks (Myōjin was done on 10 Nov). Toilets: Taishō-ike, Naka-no-se, Weston Plaza, Kappa Bridge. Boardwalks can be frosty early","places":["taisho","tashiro","imperial","kappa"],"mode":"walking"},{"id":"i16","time":"~12:00","title":"Lunch · terminal eateries or the lodge","kind":"food","how":"Kamikochi Bus Terminal eateries / The Parklodge","notes":"Many eateries are already shut in closing week; if so, buy a bento or onigiri at the terminal shop","places":["kkbus","parklodge"]},{"id":"i17","time":"~14:00","title":"Relax · lodge onsen","kind":"rest","how":"The Parklodge Kamikochi","notes":"","places":["parklodge"]},{"id":"i18","time":"~18:00","title":"Dinner · The Parklodge","kind":"food","how":"The Parklodge Kamikochi","notes":"Included","places":["parklodge"]}]},{"date":"2026-11-12","label":"12 Nov","ja":"美ヶ原","en":"Utsukushigahara","sub":"Back to Matsumoto, shuttle up the mountain","mode":"transit","hotel":"ogato","items":[{"id":"i19","time":"10:00–12:36","title":"Check out · The Parklodge Kamikochi; transit Kamikochi → Matsumoto","kind":"travel","how":"Alpico bus: Kamikochi Bus Terminal 10:40 → Shin-Shimashima 11:45 (¥3,100)\nKamikochi Line: Shin-Shimashima 12:07 → Matsumoto 12:36 (¥710)","notes":"07:30 Breakfast; last look at Kappa Bridge\n10:00 Check out (pack for one ryokan night)\n10:15 Walk 5 min to the Bus Terminal; join the reserved queue by ~10:20\n10:40 Bus (~65 min)\n11:45 Shin-Shimashima; buy train tickets, toilets (22 min)\n12:07 Train (~30 min)\n12:36 Matsumoto; through the JR concourse to the Castle Exit (お城口)\nIf the 10:40 is missed: 11:25 bus → 12:30 Shin-Shimashima → 12:48 train → 13:17 Matsumoto. Skip the sit-down lunch, buy a bento and go straight to the shuttle (28 min spare)\nRoad closures: heavy rain temporarily closes the road to Kamikochi (kamikochi.org posts advisories). Check kamikochi.org the evening of 11 Nov. If a closure is threatened, take the earliest bus that runs and phone Ōgatō Hotel (☎ 0263-50-8765), since its 13:45 shuttle is the only one of the day","places":["kkbus","shinshima","mmstn"],"action":"★ Reserve the 10:40 Kamikochi bus ~1 month ahead (≈12 Oct, from 00:00 JST)"},{"id":"i20","time":"12:45–13:20","title":"Lunch · Iidaya-ken (station-front soba)","kind":"food","how":"Hotel Iidaya 1F, 1-2-3 Chūō, Matsumoto; 1 min from the Castle Exit","notes":"Ticket machine, hot bowl in ~5 min, L.O. 13:45 (est. 1920, Tabelog 3.44; sanzoku-yaki topping). Leave by 13:20. Zero-risk alt: an Ekiben Azusa bento from inside the gates, eaten later","places":["iidaya"],"mode":"walking"},{"id":"i21","time":"13:45–~15:20","title":"Shuttle · Matsumoto Sta → Ōgatō Hotel","kind":"travel","how":"Ōgatō Hotel free shuttle from Matsumoto Sta Castle Exit (お城口): turn left toward the 7-Eleven and wait at the temporary tourist-bus parking area (観光バス臨時駐車場)\nDep 13:45 → hotel ~15:20","notes":"13:25 At the waiting area; the bus will not wait for latecomers\n13:45 Depart (~1 h 35; may run late in bad weather)\n~15:20 Ōgatō Hotel\nRuns year-round. Summer timetable 22 Apr–17 Nov (13:45 up, 11:15 down); winter timetable from 18 Nov has other times. Both your legs fall in the summer timetable","places":["ogato_pickup"],"mode":"walking","action":"★ Reserve both shuttle legs by 9 Nov (≥3 days before the stay); limited seats, first-come"},{"id":"i22","time":"~15:20","title":"Check in · Ōgatō Hotel (1 nt)","kind":"stay","how":"Ōgatō Hotel (王ヶ頭ホテル), 8964 Utsukushigahara, Iriyamabe, Matsumoto 〒390-0222 (☎ 0263-50-8765)\nUtsukushigahara summit (2,034 m); nature-reserve road, private cars prohibited, so hotel shuttle only (no MC)","notes":"Breakfast noted on the booking; onsen; kaiseki dinner expected (confirm it is included)","places":["ogato"],"action":"Future payment 14 Jun (S$); check it was settled"},{"id":"i23","time":"~18:00","title":"Onsen + kaiseki dinner · Ōgatō Hotel","kind":"food","how":"Ōgatō Hotel","notes":"20:15 Stargazing with hotel staff (daily, weather permitting; at the hotel entrance in winter mode). Free lobby drinks at 17:00 (soft drinks for you). Nights here are −11 to −8 °C in Nov (hotel's figures): full winter gear. The 06:30 Ōgahana dawn bus tour runs only 'until early Nov', so probably not on 13 Nov","places":["ogato"]}]},{"date":"2026-11-13","label":"13 Nov","ja":"長野","en":"Nagano","sub":"Sunrise walk, shuttle down, train to Nagano, Zenkō-ji","mode":"transit","hotel":"chateraise","items":[{"id":"i75","time":"~06:15–10:45","title":"Sunrise + walk · Ōgatō → Utsukushi-no-tō (and back)","kind":"visit","how":"Ōgatō summit viewpoint, next to the hotel\nUtsukushi-no-tō (美しの塔), Utsukushigahara plateau, Matsumoto; ~2.5 km from the hotel by the ranch road via Shiokureba","notes":"~06:15 Sunrise (~06:22) from the summit viewpoint beside the hotel: Alps panorama, often a sea of clouds. Back for breakfast and the onsen\n~08:45 Walk the ranch road to Utsukushi-no-tō, the stone bell tower: ~2.5 km each way, ~40–50 min, little climbing (estimate); toilet at Shiokureba. Anyone can turn back early; avoid the cliff-edge Alps viewing course (narrow, steep in parts)\n~10:30 Back at the hotel; pack for the 11:15 shuttle\nNov daytime is −3 to 5 °C with wind (hotel's figures); snow possible\nIf fog, snow or strong wind: skip the Utsukushi-no-tō walk and stay at the hotel (onsen, lounge) until the 11:15 shuttle","places":["ogato","utsukushi"]},{"id":"i24","time":"11:15–~13:00","title":"Check out · Ōgatō Hotel; shuttle → Matsumoto Sta","kind":"travel","how":"Ōgatō Hotel free shuttle down: hotel 11:15 → Matsumoto Sta ~13:00 (~1 h 45; may run late in bad weather)","notes":"Only one down shuttle a day; same booking as the up leg","places":["ogato","mmstn"],"action":"★ Reserve the down shuttle with the up leg (≥3 days ahead)"},{"id":"i25","time":"~13:05–13:45","title":"Lunch · Moriyoshi by onion (yōshoku)","kind":"food","how":"Kokufu Bldg 1F, 2-1-21 Fukashi, Matsumoto; 3 min from the station, next to Dormy Inn","notes":"Mingei Restaurant Moriyoshi by onion: old-school Matsumoto yōshoku (hamburg, katsu, croquettes) served teishoku-fast; lunch 11:30–15:00, L.O. 14:30, closed Tue (Fri fine). Leave by 13:45 for the 14:06 train. If the shuttle gets in after ~13:20, skip the sit-down: buy an ekiben inside the JR gates and eat on the train. Backup: Matsumoto Karaage Center, station bldg 4F (if skipped on 9 Nov)","places":["moriyoshi"],"mode":"walking"},{"id":"i26","time":"14:06–15:00","title":"Transit · Matsumoto → Nagano (Ltd Exp Shinano 11)","kind":"travel","how":"JR Ltd Exp Shinano 11 (Shinonoi Line): Matsumoto 14:06 → Nagano 15:00","notes":"13:50 JR ticket machine: fare + reserved seat (or book on eki-net)\n14:06 Depart\n15:00 Nagano; East (Higashi) Exit for the hotel\nShinano leaves Matsumoto at :06 past each hour. If the shuttle is early and you eat fast, the 13:06 reaches Nagano ~14:00 and gives an extra hour at Zenkō-ji","places":["mmstn","nagano_stn"],"action":"★ Reserve Shinano 11 seats on eki-net (opens 13 Oct, 10:00 JST)"},{"id":"i27","time":"~15:10","title":"Check in · Chateraise Hotel Nagano (1 nt)","kind":"stay","how":"Chateraise Hotel Nagano, 1-1 Nanase, Nagano 〒380-0922 (☎ 026-219-2440)\n5 min walk from JR Nagano Sta East (Higashi) Exit\nMC 54 188 884*25","notes":"Breakfast incl.; central base. The forwarded suitcases should be waiting at the front desk. Drop day packs and go straight to Zenkō-ji (inner hall and okaidan close 16:15); check in properly afterwards","places":["chateraise"],"mode":"walking","action":"Future payment 8 Nov (S$)"},{"id":"i28","time":"~15:25","title":"Zenkō-ji","kind":"visit","how":"Zenkō-ji, 491 Motoyoshi-chō, Nagano 〒380-0851\nTaxi from the hotel ~10 min (or ~25 min walk)\nMC 54 277 204*77 (temple Lot 1, NW corner, ¥600 / 2 h)","notes":"15:15 Taxi from the hotel\n15:25 Main hall: inner sanctuary + okaidan underground corridor (touch the 'key to paradise'). Both close 16:15; San-mon gate 16:00. Naijin-ken ticket ¥800 (inner hall, okaidan and museum)\n16:15–17:30 Shops on the approach, on the way down to dinner: Ogawa no Shō oyaki, Patio Daimon (Tabelog 3.47, until 17:00) · Yawataya Isogorō shichimi main store (custom blends, until 18:30)\nIf missed: the inner hall opens before the morning service on 14 Nov, on the way to Togakushi","places":["zenkoji"],"mode":"driving"},{"id":"i29","time":"17:30","title":"Dinner · Fujiya Gohonjin (Western, 1925 hotel building)","kind":"food","how":"THE FUJIYA GOHONJIN (藤屋御本陳), 80 Daimon-chō, Nagano 〒380-0841 (☎ 026-232-1241); on Chūō-dōri at the foot of the Zenkō-ji approach, a short walk from the main hall\nBack: taxi to the hotel ~10 min","notes":"Tabelog 3.61. Dinner course 'Wisteria' ¥9,800; weekday dinner from 17:30, L.O. 20:00. Replaces a third soba meal (Togakushi soba is tomorrow). It sometimes closes for weddings, so confirm Fri 13 Nov when booking. Backup: Miyota, MIDORI Nagano 3F (Tabelog 3.48, L.O. 21:30; Shinshū beef sets)","places":["fujiya"],"mode":"walking","action":"★ Reserve now (Nov bookings open): ☎ 026-232-1241 or Toreta online (weekday seats)"}]},{"date":"2026-11-14","label":"14 Nov","ja":"宇奈月","en":"Unazuki","sub":"Rental car: Togakushi, soba lunch, crab at Nou","mode":"driving","hotel":"yamanoha","items":[{"id":"i30","time":"08:00–08:30","title":"Check out · Chateraise Hotel Nagano; pick up rental car","kind":"travel","how":"Nissan Rent a Car, Nagano Sta East Exit (☎ 026-268-1123); open 08:00–20:00 until 30 Nov","notes":"08:00 Check out; walk to Nissan\n08:30 Drive off\n~09:20 Togakushi Okusha car park (toilets here; none beyond Zuishinmon)\n~10:50 Back at the car\n~11:00 Togakushi soba lunch, Soba no Mi\n~11:45 Optional 5 min at Chūsha's giant cedars\n~12:00 Drive on (~1 h 25 to Nou)\n~13:30 Marine Dream Nou, crab\n~14:30 Drive on (~1 h 10)\n~15:40 Yamanoha, before dark (sunset ~16:40)\n~3 h 20 of driving (estimate from expressway km posts, 2 Oct). Bring International Driving Permits\nIf the Togakushi road is wet-icy or snowy that morning: Plan B is Obuse instead of Togakushi (Optional row below); the crab and Yamanoha timings hold","places":["nissan"],"mode":"walking","action":"★ Confirm Nissan booking, International Driving Permits and an ETC card"},{"id":"i31","time":"~09:20–10:50","title":"Togakushi Shrine Okusha (Zuishinmon gate + cedar avenue)","kind":"visit","how":"Drive Nagano → Togakushi via the Bird Line, ~22 km / ~50 min (est.)\nMC 1004 037 444*20 · alt 1004 009 327*58 (Okusha car park, ¥800 for 3 h, then ¥100/h, max ¥1,200; since Apr 2025)","notes":"Car park → Zuishinmon gate ~1 km, ~15–20 min on a gentle path. Zuishinmon → Okusha ~25–30 min, rougher, with steep stone steps at the top (~45 min up, ~30 min down in all). Toilets only at the car park and around Zuishinmon; none beyond. Turning back at the gate saves ~1 h, so EH & BY can turn there and wait at the car-park tea house (Okusha no Chaya) while the Okusha group finishes. The Okusha is open on 14 Nov (it closes 7 Jan–late Apr); the main car park stops winter operation from late Nov","places":["togakushi_p","togakushi"]},{"id":"i32","time":"~11:00–11:45","title":"Lunch · Togakushi soba, Soba no Mi","kind":"food","how":"Soba no Mi (そばの実), Togakushi 3510-25, Nagano; between the Okusha and Chūsha, ~11 min walk from Chūsha; 30 car spaces\nZero-queue fallback: Okusha no Chaya at the Okusha car-park entrance (Tabelog 3.42; 10:00–17:00 to mid-Nov, then 10:30–15:00; irregular closures)","notes":"Tabelog 3.75, Soba Top 100; walk-in only, sells out. Opens 10:30 per Tabelog, 11:00 per the Togakushi tourism site (10:30 on busy weekends), so plan on 11:00. Closed Thu and Fri (tourism site: Thu + 2nd/4th Fri); Sat fine. The best soba of the trip; keep it light ahead of the crab. Uzuraya (Tabelog 3.76) is the famous one but has had ~2 h queues on autumn weekends, so skip it. Then optional 5 min at Togakushi Chūsha's three ~800-year-old cedars by the torii. Naena Falls dropped: closing date borderline and a rocky path with steps","places":["sobanomi"]},{"id":"i89","time":"~08:30–12:00","title":"Optional (if the Togakushi road is icy) · Obuse: Hokusai-kan + chestnut lunch","kind":"visit","how":"Drive Nagano Sta → Obuse, ~19 km / 30–40 min on local roads (est.)\nHokusai-kan (北斎館), 485 Obuse, Obuse-machi, Nagano 〒381-0201 (☎ 026-247-5206); East Town car park ¥200 first hour\nChikufūdō Obuse Honten (竹風堂 小布施本店), 973 Obuse, Obuse-machi (☎ 026-247-2569)\nMC not checked: set the nav by phone number","notes":"Plan B for 14 Nov if the mountain road to Togakushi is wet-icy or snowy; replaces the Okusha and Soba no Mi rows\n~09:00 Hokusai-kan (09:00–17:00, last entry 16:30; ¥1,800 during the 'EXPOSITION HOKUSAI' special exhibition, 24 Oct 2026–17 Jan 2027; wheelchairs at the desk): Hokusai's late paintings and festival-float ceilings; indoor and flat\n~10:30 Short stroll on the chestnut-wood paths of the old town\n~11:00 Lunch at Chikufūdō: chestnut okowa sets (dining from 10:00, L.O. 17:30 in winter; prices not checked)\n~12:00 Drive on: Obuse PA Smart IC (ETC card only) → Jōshin'etsu Expwy → Jōetsu JCT → Nou IC, ~95 km / ~1 h 20 (est.), so the crab at ~13:30 and Yamanoha at ~15:40 still hold","places":["hokusai","chikufudo"]},{"id":"i33","time":"~13:30–14:30","title":"Crab · Kaniya Yokochō crab stalls, Marine Dream Nou","kind":"food","how":"Drive Togakushi → Shinano-machi IC (~30 min) → Jōshin'etsu Expwy → Jōetsu JCT → Hokuriku Expwy → Nou IC, ~84 km / ~1 h 25 (est. from expressway km posts)\nMichi-no-Eki Marine Dream Nou, 3596-2 Nou-Kodomari, Itoigawa 〒949-1351 (☎ 025-566-3456)\nMC 707 090 264*60","notes":"Pick a boiled benizuwai (~¥1–3k per crab; share 1–2 between three after the soba) from the 7 fishing-family stalls; try Hōjumaru (known to add a free bonus crab). They crack it and you eat at the free tables. Stalls close 17:00 from Nov and sell out. Sit-down alt inside: Banya (crab-tempura teishoku ~¥2.6k)","places":["nou"]},{"id":"i34","time":"~15:40","title":"Check in · Yamanoha (2 nt)","kind":"stay","how":"Drive Marine Dream Nou → Nou IC → Kurobe IC (Hokuriku Expwy) → Unazuki, ~72 km / ~65–70 min (est.)\nYamanoha, 352-7 Unazuki-onsen, Kurobe, Toyama 〒938-0282 (☎ 0765-62-1311)\nFree guest parking; 3 min walk from Unazuki-Onsen Sta\nMC 220 235 644*67","notes":"Breakfast + dinner incl.; onsen. Long driving day: Togakushi + Nou","places":["yamanoha"],"action":"Night 1 paid (Agoda); night 2 S$569.22 to pay at the hotel"},{"id":"i35","time":"~18:30","title":"Onsen + dinner · Yamanoha","kind":"food","how":"Yamanoha","notes":"Included","places":["yamanoha"]}]},{"date":"2026-11-15","label":"15 Nov","ja":"黒部峡谷","en":"Kurobe Gorge","sub":"Gorge trolley, Kajika lunch, maple promenade","mode":"walking","hotel":"yamanoha","items":[{"id":"i36","time":"08:17–11:20","title":"Kurobe Gorge Railway (trolley) · Unazuki ↔ Keyakidaira","kind":"visit","how":"Unazuki 08:17 → Keyakidaira 09:33; Keyakidaira 10:01 → Unazuki 11:20 (timetable 1 Oct–23 Nov 2026)\n~5 min walk from Yamanoha; car stays parked (if driving: MC 220 235 406*32, Times station-front car park ~¥1,000 / 6 h)","notes":"07:55 Leave Yamanoha\n08:00 Collect tickets at Unazuki Sta\n08:17 Depart (~76 min each way)\n09:33 Keyakidaira: station plaza, rooftop and visitor centre only (access restricted), so mainly the ride\n10:01 Return (or 10:43 → 12:02 for longer at the top; the 10:43 has no Relax car)\n11:20 Unazuki\nFull line reopened 1 Oct 2026 after the quake. Windowed Relax car (+¥600 each way) is worth it in the Nov cold. Fare ¥2,480 each way, no senior discount\nIf the trolley is suspended (heavy rain or rockfall): do the Uozu option below in the morning if clear; otherwise the Electric Memorial Hall, the roofed footbath and the onsen","places":["unazuki_stn","keyakidaira"],"action":"★ Book the trolley now, phone only: ☎ 0765-62-1011 (09:00–16:30); ask for the Relax car"},{"id":"i76","time":"~11:45","title":"Lunch · Kajika (kamameshi + oden)","kind":"food","how":"Kajika (河鹿), 330-19 Unazuki-onsen, Kurobe, Toyama (☎ 0765-62-1505)\n~1 min walk from Unazuki-Onsen Sta","notes":"Tabelog 3.44, the best-rated lunch in Unazuki; counter and tatami seating. Lunch 11:00–14:00, closed Tue (Sun fine). No driving today; rest before the long drive to Niigata\nIf clear: swap for the Uozu option below (lunch at Komasa Sushi)","places":["kajika"]},{"id":"i77","time":"~13:00–15:30","title":"Stroll · Yamabiko Promenade → Unazuki Dam viewpoint","kind":"visit","how":"Yamabiko Promenade (やまびこ遊歩道), start ~2 min walk from the trolley's Unazuki Sta; ~1 km to the Unazuki Dam viewpoint\nKurobe River Electric Memorial Hall (黒部川電気記念館), next to the trolley station (☎ 0765-62-1334)\nFootbath Omokage, Unazuki Park, ~5 min walk from Unazuki-Onsen Sta","notes":"Unazuki's colour usually peaks mid-Nov, so this is likely the best foliage of the trip. The path follows the old rail bed (gradient unverified, but gentle by design). From the old Yamabiko Bridge you get the classic view of the trolley crossing the red Shin-Yamabiko Bridge; EH & BY can turn there. Open to 'late Nov' (2025 pattern). Then the free Electric Memorial Hall (07:30–18:00) and the free roofed footbath (06:00–22:00; bring a towel)\nIf heavy rain: skip the walk; Memorial Hall + roofed footbath + onsen instead","places":["yamabiko","kurobe_denki"]},{"id":"i90","time":"11:45–16:21","title":"Optional (if clear) · Uozu by train: Komasa Sushi + Buried Forest Museum + Tateyama view","kind":"visit","how":"Toyama Chihō Railway (Chitetsu) local, Sun/holiday timetable: Unazuki-Onsen 11:45 → Shin-Uozu 12:30 (¥1,080; ¥970 by IC card)\nKomasa Sushi (小政寿司), 1-6-9 Kamimuragi, Uozu, Toyama (☎ 0765-22-5383); ~5 min walk from Uozu Sta (beside Chitetsu Shin-Uozu)\nUozu Buried Forest Museum (魚津埋没林博物館), 814 Shakadō, Uozu 〒937-0067 (☎ 0765-22-1049); taxi from Komasa ~10 min (est.)\nBack: Dentetsu-Uozu 15:26 → Unazuki-Onsen 16:21 (¥1,200)","notes":"Replaces the Kajika lunch and the promenade on a clear day; no driving\n11:45 Train from Unazuki-Onsen → 12:30 Shin-Uozu; walk to Komasa\nKomasa: Toyama Bay sushi (Tabelog 3.47); lunch daily 11:30–14:00 (L.O. 13:30), irregular closures, so phone ahead\n~13:45 Taxi to the Buried Forest Museum (¥640, 09:00–17:00, last entry 16:30, open daily to 30 Nov): ancient tree stumps preserved underwater. On a clear day the waterfront beside it has the classic view of the Tateyama range rising across Toyama Bay\n15:26 Train back from Dentetsu-Uozu → 16:21 Unazuki-Onsen (55 min). Next: 16:26 → 17:25\nTimes from Chitetsu's own route search (holiday service), checked 2 Oct 2026","places":["komasa","uozu_forest"],"action":"★ If going: phone Komasa the day before (☎ 0765-22-5383)"},{"id":"i38","time":"~18:30","title":"Onsen + dinner · Yamanoha","kind":"food","how":"Yamanoha","notes":"Included","places":["yamanoha"]}]},{"date":"2026-11-16","label":"16 Nov","ja":"新潟","en":"Niigata","sub":"Drive: Yahiko maples and light-up, Niigata","mode":"driving","hotel":"niigata","items":[{"id":"i39","time":"09:15","title":"Check out · Yamanoha; drive Unazuki → Niigata","kind":"travel","how":"Hokuriku Expwy, ~4 h of driving (estimate from expressway km posts) plus the stops below. Sunset ~16:30","notes":"09:15 Depart (leisurely onsen morning)\n~11:00 Yoneyama SA (drive ~1 h 45); lunch to ~11:45. The 30 min spare is buffer, or leave Yamanoha later\n~13:10 Yahiko Park + Shrine (incl. optional ropeway)\n~17:00 Momijidani light-up\n~17:20 Drive to Niigata (~1 h, after dark)\n~18:20 Niigata Daiichi Hotel; park, check in, short rest\n~19:15 Taxi to Marui (~10 min) for a 19:30 booking\nTakada Castle Park dropped (turret closed Mondays). Rotate drivers; ETC for tolls. All drive times are estimates","places":["yamanoha"],"action":"Refuel; ETC card for tolls"},{"id":"i41","time":"~11:00","title":"Lunch · Yoneyama SA (Niigata-bound)","kind":"food","how":"Drive Unazuki → Kurobe IC (~20 min) → Jōetsu JCT → Yoneyama SA (~113 km), ~1 h 45 (est.); on the Hokuriku Expwy","notes":"Echigontei kaisendon + the cult saba sandwich. Earlier option: Nadachidanihama SA (tare-katsudon)","places":["yoneyama"]},{"id":"i42","time":"~13:10–17:20","title":"Yahiko Park (Momijidani) + Yahiko Shrine; stay for the light-up","kind":"visit","how":"Drive via Nagaoka JCT → Sanjō-Tsubame IC, ~1 h 25 (est.)\nYahiko Park, Yahiko-mura (☎ 0256-94-3154)\nMC 190 099 444*47\nYahiko Shrine, 2887-2 Yahiko (☎ 0256-94-2001), next to the park","notes":"Momijidani maple valley: the 2026 forecast says best from ~14 Nov (Weathernews). Stay for the light-up from 17:00 (17:00–21:00 from ~30 Oct, per Weathernews, not an official source); sunset is ~16:32, so bring an extra layer for the wait. Parking near Momijidani is paid during the light-up (~¥500 in 2022). Chrysanthemum Festival at the shrine 1–24 Nov (shrine car parks paid during the festival). Cedar-lined approach. Snack: Bunsuidō panda-yaki (Tabelog 3.49, open Mon, sells out)\nIf wet: shrine + a short look at Momijidani, skip the wait for the light-up, leave ~16:00 and reach Niigata early (Marui stays at 19:30)","places":["yahiko_park","yahiko_shrine"]},{"id":"i43","time":"~15:00","title":"Optional · Mt Yahiko Ropeway (not the hike)","kind":"visit","how":"Yahiko Ropeway (Sanroku base); no car access: free shuttle from behind the shrine every ~15 min (3 min ride) or ~15 min walk\nMC 190 129 226*37 (shrine-side car park, 50 cars)","notes":"Only if there is daylight left: Sea of Japan and Sado Island views. Ropeway 09:00–16:40 (Apr–Nov, 2025 pattern), ¥1,500 return\nIf clear: worth it for the Sado views. Skip in rain, low cloud or high wind","places":["ropeway"],"action":"★ Confirm no maintenance closure on 16 Nov: ☎ 0256-94-4141"},{"id":"i44","time":"~18:20","title":"Check in · Niigata Daiichi Hotel (1 nt)","kind":"stay","how":"Drive Yahiko → Niigata, ~1 h (est.)\nNiigata Daiichi Hotel, 1-3-12 Hanazono, Chūō-ku, Niigata 〒950-0086 (☎ 025-243-1111)\n~2 min walk from JR Niigata Sta Bandai Exit; indoor hotel garage ~¥1,200 / night, 72 spaces, no reservations, height limit 1.58 m (Jalan says 1.50 m); taller cars go to a partner car park (up to 2 m)\nMC 32 877 298*72","notes":"Breakfast incl.; drop luggage and rest, then taxi to Furumachi (~19:15)","places":["niigata"],"action":"Future payment (UOB) · ★ Check the Nissan car's height (hotel garage max 1.58 m; no reservations)"},{"id":"i45","time":"19:30","title":"Dinner · Splurge ①: Sushi Kappō Marui","kind":"food","how":"8-1411 Higashibori-dōri, Chūō-ku, Niigata (Furumachi); ~10 min by taxi","notes":"Tabelog 3.55; courses ¥7.7k–11k; nodoguro shioyaki and aburi-don on Niigata Koshihikari. Backup: Inakaya (Tabelog 3.45, wappa-meshi, open Mon, ☎ 025-223-1266). Tonkatsu Tarō (Tabelog 3.57, tare-katsudon birthplace) is lunch-only since May 2024 and closed Wed–Thu, so it can't be the dinner backup","places":["marui"],"mode":"transit","action":"★ Reserve by late Oct (☎ 025-228-0101 / Gurunavi); confirm it is open Mon 16 Nov (irregular closures)"},{"id":"i46","time":"~21:00","title":"Riverside stroll · Furumachi old town + Bandai Bridge","kind":"visit","how":"Furumachi / Bandai, Niigata","notes":"Flat, walkable, low-key","places":["bandai"],"mode":"walking"}]},{"date":"2026-11-17","label":"17 Nov","ja":"三条","en":"Sanjō","sub":"Drive: copper workshop, ramen, metalwork, ryokan","mode":"driving","hotel":"rankeisou","items":[{"id":"i47","time":"09:10","title":"Check out · Niigata Daiichi Hotel; drive → Tsubame → Sanjō → Rankeisou","kind":"travel","how":"Hokuriku Expwy Niigata-Chūō IC → Sanjō-Tsubame IC, ~45–50 min to Gyokusendō; Kōshū Hanten ~5 min on; Jibasan Center ~15 min on; then ~40–45 min to Rankeisou (est.)","notes":"09:10 Depart\n~09:55 Gyokusendō car park\n10:00–10:45 Gyokusendō workshop tour + showroom\n~10:45 Drive to Kōshū Hanten (~5 min, est.); queue for the 11:00 opening\n~11:00–11:50 Lunch\n~11:50 Drive to the Jibasan Center (~15 min, est.)\n~12:05–13:45 Jibasan Center\n~13:45 Drive on (~40 min)\n~14:25 Yagi-ga-hana cliff (~15 min stop)\n~14:50 Rankeisou; check-in from 15:00\nThis order avoids driving back into Tsubame and passing Jibasan twice","places":["niigata"]},{"id":"i78","time":"10:00–10:45","title":"Gyokusendō (玉川堂) · hand-hammered copper workshop tour","kind":"visit","how":"Gyokusendō, 2-2-21 Chūō-dōri, Tsubame, Niigata (☎ 0256-62-2015); ~22–30 car spaces\nMC not checked: set the nav by phone number","notes":"Hand-hammered Tsubame copperware since 1816; the free factory tour (15–30 min) shows the craftsmen at work. Tours Mon–Sat 10:00 / 11:00 / 13:00 / 14:00 / 15:10, free for 1–5 people; closed Sun and holidays, and tours can be cancelled on factory days off, so book. Showroom 08:30–17:30. Tell them about the older visitors when booking","places":["gyokusendo"],"action":"★ Book the 10:00 tour (3 people): ☎ 0256-62-2015 or the online form (gyokusendo.com/openfactory)"},{"id":"i48","time":"~11:00–11:50","title":"Lunch · Kōshū Hanten (Tsubame back-fat ramen originator)","kind":"food","how":"49-4 Tsubame, Tsubame-shi; 50-car parking; ~5 min from Gyokusendō (est.)","notes":"Tabelog 3.74 (Ramen Hyakumeiten), the trip's top score; chūka soba ~¥950. No reservations, 70 seats: be in the queue before the 11:00 opening (Tue lunch 11:00–14:30). ⚠ Closed Mon, plus 1–2 extra days a month (often a Tue). Backup: Chūkatei, Sanjō (Tabelog 3.46, closed Mon only)","places":["koshu"],"action":"★ Call ~14 Nov to confirm it is open Tue 17 Nov: ☎ 0256-64-3770"},{"id":"i49","time":"~12:05–13:45","title":"Tsubame-Sanjō Jibasan Center (Regional Industries Promotion Center)","kind":"visit","how":"Drive ~15 min from Kōshū Hanten (est.); 3 min from Sanjō-Tsubame IC\nTsubame-Sanjō Jibasan Center, 1-17 Suyori, Sanjō, Niigata (☎ 0256-32-2311)\nMC 58 832 492*57 (alt *86)","notes":"Showroom + shop for local Tsubame-Sanjō metalwork (knives, cutlery, copperware). Open 09:30–17:30; closed only on the 1st Wed of the month (17 Nov is a Tue). Plenty of time to browse and sit; on the way out toward Rankeisou","places":["jibasan"]},{"id":"i79","time":"~14:25–14:40","title":"Viewpoint · Yagi-ga-hana cliff","kind":"visit","how":"Yagi-ga-hana (八木ヶ鼻), Shitada, Sanjō, Niigata; on the road to Rankeisou, ~5 min before the inn (est.)\nPull in at the Yagi-ga-hana Onsen 'Iiyuratei' day-spa car park (~20 free spaces) or the riverbank","notes":"200 m+ sheer cliff above the Igarashi River, with Yagi Shrine at its foot. Autumn colour usually peaks ~1–15 Nov, so it may be just past peak on 17 Nov. A short stop from the car; no walking needed","places":["yagigahana"]},{"id":"i50","time":"~14:50–15:00","title":"Check in · Rankeisou (1 nt)","kind":"stay","how":"Drive Jibasan Center (by Sanjō-Tsubame IC) → ~23 km of local roads, ~40–45 min (est.; Rankeisou gives 23.4 km from the IC)\nRankeisou, 1450 Nagano, Sanjō, Niigata 〒955-0132 (☎ 0256-47-2211)\n50 free spaces\nMC 318 374 796*67","notes":"Historic 3-storey wooden ryokan (est. 1933) on the Sumon River. Breakfast + kaiseki dinner incl.; salt-rich onsen","places":["rankeisou"]},{"id":"i51","time":"~18:00","title":"Onsen + kaiseki dinner · Rankeisou","kind":"food","how":"Rankeisou","notes":"Book the private bath if wanted","places":["rankeisou"]}]},{"date":"2026-11-18","label":"18 Nov","ja":"川崎","en":"Kawasaki","sub":"Drive to Nagano, Shinkansen to Tokyo","mode":"driving","hotel":"mets","items":[{"id":"i52","time":"10:00","title":"Check out · Rankeisou; drive → Nagano (return car)","kind":"travel","how":"Sanjō → Nagano via Hokuriku and Jōshin'etsu Expwys, ~200 km / ~3 h of driving (estimate)","notes":"10:00 Check out (leisurely onsen morning)\n~10:45 Sanjō-Tsubame IC\n~12:05 Lunch, Arai PA / Roadside Station Arai (45 min)\n~13:55 Refuel near Nagano Sta\n~14:10 Return car\n15:22 Shinkansen Hakutaka 566\n~1 h of buffer for snow or traffic on the Myōkō stretch","places":["rankeisou"]},{"id":"i53","time":"~12:05","title":"Lunch · Roadside Station Arai (Kitokito kaiten sushi)","kind":"food","how":"Drive Rankeisou → Sanjō-Tsubame IC (23 km) → Jōetsu JCT → Arai PA (~109 km of expressway), ~2 h (est.)\nNo need to exit: park at Arai PA on the Nagano-bound (上り) side and walk into the Michi-no-Eki\nMichi-no-Eki Arai, Myōkō, Niigata (☎ 0255-70-1021)\nMC 126 072 674*45","notes":"Food court + local market, on the Jōshin'etsu route to Nagano. Lunch: Himi Kitokito-zushi (kaiten sushi from Himi, Toyama; open daily 11:00–20:30 with a weekday break ~15:00–16:00; Tabelog 3.24), Shokudō Misa (miso ramen, Tabelog 3.51; 11:00–20:30, no fixed closing day, irregular closures) or Rāmen Shō (closed Mon only; Tabelog 3.30)","places":["arai"]},{"id":"i54","time":"~14:10","title":"Return rental car · Nissan Nagano","kind":"travel","how":"Drive Arai → Nagano Sta, ~1 h 05 (est.)\nNissan Rent a Car, Nagano Sta East Exit (☎ 026-268-1123)","notes":"Refuel before return; ~5 min walk to the Shinkansen gates","places":["nissan"],"action":"Refuel before return"},{"id":"i55","time":"15:22–16:52","title":"Transit · Nagano → Tokyo (Hokuriku Shinkansen Hakutaka 566)","kind":"travel","how":"Hakutaka 566: Nagano dep 15:22 (pulls in 15:20) → Tokyo 16:52 (Ōmiya 16:27, Ueno 16:46)","notes":"14:15 MIDORI Nagano 2F: Obuse chestnut sweets to take home at Obuse-dō (09:00–20:00) and Sakurai Kanseidō (Tabelog 3.56; café to 18:00)\n14:45 Collect reserved tickets; snack or ekiben (Kusabue, MIDORI Nagano 3F, kurumi walnut soba, open daily)\n15:22 Depart\n16:52 Tokyo\nLater options: Asama 622, 15:25 → 17:12; Hakutaka 568, 16:20 → 17:52","places":["nagano_stn","tokyo_stn"],"mode":"walking","action":"★ Reserve Hakutaka 566 seats on eki-net (opens 18 Oct, 10:00 JST); point-to-point, no rail pass pays off"},{"id":"i56","time":"~17:00–17:30","title":"Check in · JR-East Hotel Mets Kawasaki (3 nt)","kind":"stay","how":"JR Tōkaidō Line Tokyo → Kawasaki, ~18 min\nJR-East Hotel Mets Kawasaki, 72-2 Horikawa-chō, Saiwai-ku, Kawasaki 〒212-0013 (☎ 044-540-1100)\n1 min from JR Kawasaki Sta Central Exit (West)","notes":"17:00 Change at Tokyo to the Tōkaidō Line platforms; ~17:30 hotel. Breakfast incl.; commuter base; bags stored. 2 rooms × 3 nights","places":["mets"],"mode":"transit","action":"Future payments 15–16 Nov (S$)"},{"id":"i57","time":"~19:00","title":"Dinner · Matsu no Ki (Sichuan)","kind":"food","how":"6-11 Miyamoto-chō, Kawasaki-ku; ~8 min walk from JR Kawasaki east side","notes":"Tabelog 3.69, Top 100 Chinese; mapo tōfu and tantanmen after the travel day. ☎ 044-221-9939 to book dinner (closed Mon and Tue; Wed fine). Late-arrival fallback: Sansan-nana tsukemen (Tabelog ~3.7, open daily until 23:00)","places":["matsu"],"mode":"walking"}]},{"date":"2026-11-19","label":"19 Nov","ja":"原宿","en":"Harajuku","sub":"Meiji Jingū, Nezu Museum, Omotesandō, wagyu dinner","mode":"transit","hotel":"mets","items":[{"id":"i58","time":"~09:15–10:45","title":"Meiji Jingū","kind":"visit","how":"JR Kawasaki → Shinagawa (Tōkaidō Line) → Harajuku (Yamanote Line), ~40 min with the change\nMeiji Jingū, 1-1 Yoyogi-Kamizonochō, Shibuya-ku, Tokyo 〒151-8557\nMain hall ~10 min walk from the gates","notes":"08:30 Leave the hotel; ~09:15 Harajuku. Forested shrine walk in the city; ~1.5 h. Add the Inner Garden (Gyoen, ¥500, 09:00–16:00 in Nov; gentle paths with rest shelters) on the way to the main hall: quieter than the main approach. Mid-Nov brings Shichi-go-san families; a Thursday is moderate","places":["meiji"]},{"id":"i59","time":"~11:15","title":"Lunch · Tonkatsu Maisen Aoyama Honten","kind":"food","how":"4-8-5 Jingūmae, Shibuya-ku; 3 min from Omotesandō exit A2, ~10 min walk from Meiji Jingū","notes":"The famous former-bathhouse tonkatsu (Tabelog 3.44, 200+ seats so the queue turns fast; easiest before 11:30 or after 13:30; weekday seat reservations ☎ 050-3188-5802). Backup: Harajuku Gyōza Rō (Tabelog 3.49, cash only)","places":["maisen"],"mode":"walking"},{"id":"i80","time":"~12:45–14:30","title":"Nezu Museum + garden","kind":"visit","how":"Nezu Museum (根津美術館), 6-5-1 Minami-Aoyama, Minato-ku, Tokyo; ~8–10 min walk from Maisen / Omotesandō Sta","notes":"Special exhibition 'Bugaku costumes' (24 Oct–23 Nov 2026). 10:00–17:00, closed Mon. ¥1,600 online timed ticket (+¥200 at the counter, only if slots remain); no senior discount. Lifts to every floor; the garden has slopes and steps, so EH & BY can stay on the upper paths. Maples usually turn in the 2nd half of Nov. NEZUCAFÉ in the garden (food L.O. 15:00). Replaces Takeshita-dōri (crowded)","places":["nezu"],"action":"★ Book a timed ticket for ~12:45 (e-tix.jp/nezu-muse)"},{"id":"i81","time":"~14:30–15:30","title":"Stroll · Omotesandō and Cat Street","kind":"visit","how":"Omotesandō avenue, Cat Street (Jingūmae)","notes":"Easy, flat shopping street. Café: BREAD, ESPRESSO & (3-4-9 Jingūmae, Tabelog 3.60; the mou toast; until 19:00, irregular holidays). Alt: Aoyama Flower Market GREEN HOUSE (tea inside the flower shop, open daily). Then on to Shibuya for Yuji\nIf wet: Omotesandō Hills instead (indoor, same avenue)","places":["bread"]},{"id":"i82","time":"~15:30–16:30","title":"Optional · Jingū Gaien ginkgo avenue (only with the 18:00 Yuji seating)","kind":"visit","how":"Jingū Gaien Ichō Namiki, Kita-Aoyama 1-chōme, Minato-ku, Tokyo; Ginza Line Omotesandō → Gaien-mae (1 stop), then ~5 min walk\nThen to Shibuya: Ginza Line Gaien-mae → Shibuya, ~5 min","notes":"~300 m avenue of ginkgo trees, flat, free, open any time. Weathernews 2026 forecast: best from ~29 Nov, so on 19 Nov expect it only partly yellow. Skip if Yuji is the 16:00 seating","places":["gaien"]},{"id":"i61","time":"16:00 or 18:00","title":"Dinner · Splurge ②: Sumibiyaki Yuji (wagyu yakiniku)","kind":"food","how":"Matsunuma Bldg 1F, 11-1 Udagawa-chō, Shibuya; ~8 min walk from Shibuya Sta\nBack: JR Yamanote Line Shibuya → Shinagawa, then Tōkaidō Line → Kawasaki, ~35 min","notes":"Tabelog 4.19 + Tabelog Award Bronze, the trip's crown jewel; ~¥8–10k pp, cash only. Slots go months out. Closed Sun and holidays; seatings 16:00 and 18:00. If skipping the splurge: Hikiniku to Come (Tabelog 3.70, charcoal wagyu-blend hamburg; web booking opens on the 1st of the month, cashless)","places":["yuji"],"action":"★ Reserve now: phone only, ☎ 03-3464-6448 after 15:00 JST (Mets front desk can call)"}]},{"date":"2026-11-20","label":"20 Nov","ja":"鎌倉","en":"Kamakura","sub":"Day trip: Great Buddha, Hase-dera, Hachimangū, sunset","mode":"transit","hotel":"mets","items":[{"id":"i62","time":"08:30–~09:15","title":"Day trip · Kamakura (transit from Kawasaki)","kind":"travel","how":"JR Tōkaidō Line Kawasaki → Totsuka (~25 min), change across the platform to the Yokosuka Line → Kamakura; ~35 min, ¥620 (no direct train; changing at Ōfuna or Yokohama also works, ~40–45 min)","notes":"08:30 Leave the hotel; ~09:10 Kamakura; Enoden to Hase (~5 min). Coastal old capital\nSwap option: if Fri is wet and Sat is forecast clear, swap 20 and 21 Nov (Kamakura on Sat; Tsukiji, Hama-rikyū, Ginza and Shiseido on Fri). Trade-offs: Ginza Chūō-dōri is car-free only Sat–Sun, and Kamakura is busier on Sat. On a Sat Kamakura day, check out at 08:30, leave the bags at Mets and collect them on the way back. Opening days suit a swap: Shirasuya closes Thu only, Rengatei Sun only, Shiseido Parlour Mon only, Tsukiji is open on Fri 20 Nov","places":["kotokuin"]},{"id":"i63","time":"~09:30–10:15","title":"Kōtoku-in · Great Buddha (Daibutsu)","kind":"visit","how":"Kōtoku-in, 4-2-28 Hase, Kamakura 〒248-0016\n~7 min walk from Hase Sta (Enoden)","notes":"Flat, easy; outdoor bronze Buddha. 08:00–17:00, ¥300","places":["kotokuin"]},{"id":"i64","time":"~10:25–11:10","title":"Hase-dera","kind":"visit","how":"Hase-dera, 3-11-2 Hase, Kamakura 〒248-0016 (☎ 0467-22-6300)\n~7 min walk from the Daibutsu","notes":"Temple and sea views. 08:00–16:30 entry, ¥400. Leave by 11:10 for the Enoden to Koshigoe","places":["hasedera"],"mode":"walking"},{"id":"i65","time":"~11:30","title":"Lunch · Shirasuya (shirasu-don specialist)","kind":"food","how":"2-10-13 Koshigoe, Kamakura; 3 min from Enoden Koshigoe Sta (Hase → Koshigoe ~15 min, ¥260, ~4 trains an hour)","notes":"Fishing-family-run (Tabelog 3.52); shirasu-zukushi set. Nov is in season (the fishing ban is only Jan–Mar); raw shirasu only if the morning catch allows, boiled kama-age always on. Opens 11:00, closed Thu (Fri fine); arrive by 11:30 to beat the queue. Backup: Matsubara-an garden soba (Tabelog 3.67, Yuigahama)","places":["shirasuya"]},{"id":"i66","time":"~13:00–13:45","title":"Stroll · Komachi-dōri","kind":"visit","how":"Enoden Koshigoe → Kamakura, ~25 min; Komachi-dōri starts at Kamakura Sta East Exit","notes":"Buy the Beniya 'Kurumicco' walnut caramels first (Hachimangū-mae honten 09:30–17:00, open daily; sells out). Snack crawl: Ichibanya hand-grilled senbei · Imoyoshikan purple-sweet-potato soft cream. Sit-down: Café Vivement Dimanche (Tabelog 3.66, Top 100; closed Wed and Thu, Fri fine, until 18:00)","places":["komachi"]},{"id":"i83","time":"~13:45–14:30","title":"Tsurugaoka Hachimangū","kind":"visit","how":"Tsurugaoka Hachimangū, 2-1-31 Yukinoshita, Kamakura; at the top of Komachi-dōri / Wakamiya-ōji","notes":"Main hall is 61 steps up (the Ōishidan), with no lift or slope; a side stair beside Wakamiya has 70 gentler steps with handrails. EH & BY can stay at the lower Maiden stage and Genpei Pond. Accessible toilet near the archery ground\nIf wet: add the Kamakura Kokuhōkan (Optional row below) before Hōkoku-ji","places":["hachimangu"]},{"id":"i91","time":"~14:15–14:50","title":"Optional (if wet) · Kamakura Kokuhōkan (National Treasure Museum)","kind":"visit","how":"Kamakura Kokuhōkan (鎌倉国宝館), 2-1-1 Yukinoshita, Kamakura (☎ 0467-22-0753); inside the Tsurugaoka Hachimangū grounds","notes":"Rainy-day indoor stop: special exhibition on Zuisen-ji's 700 years (24 Oct–6 Dec 2026) plus Kamakura-period sculpture. 09:00–16:30 (last entry 16:00), closed Mon (Fri fine). ¥1,000 during this exhibition (the free 65+ entry is for Kamakura residents only). Accessibility not checked. Then taxi to Hōkoku-ji, arriving by ~15:00 while matcha is still served (to 15:30)","places":["kokuhokan"]},{"id":"i84","time":"~14:40–15:45","title":"Hōkoku-ji bamboo garden + matcha","kind":"visit","how":"Hōkoku-ji (報国寺), 2-7-4 Jōmyōji, Kamakura; taxi ~2 km / 7–10 min from Hachimangū (est.) or Keikyū bus from Kamakura Sta East Exit stand 5 to 'Jōmyōji' + 3 min walk","notes":"Bamboo grove ¥400, 09:00–16:00; matcha + sweet ¥600 at the Kyūkōan tea house, served until 15:30. A seated rest. Then taxi ~7 km / 20–30 min (est.; Fri late-afternoon traffic through central Kamakura and Rte 134) to Inamuragasaki for the sunset: leave by ~15:40","places":["hokokuji"]},{"id":"i85","time":"~16:10–16:45","title":"Sunset · Inamuragasaki (Mt Fuji over the sea)","kind":"visit","how":"Inamuragasaki Park, Inamuragasaki, Kamakura; ~5 min walk from Enoden Inamuragasaki Sta\nBack: Enoden Inamuragasaki → Kamakura, ~10 min","notes":"Sunset ~16:34. On a clear day Mt Fuji and Enoshima stand out over Sagami Bay. Low cape, short walk, benches. Then Toshimaya Hato Sablé main store (Komachi 2-11-19, 09:00–19:00, Fri fine) on the way to dinner\nIf wet or overcast: skip it (no Fuji); go straight to Hato Sablé and an earlier dinner","places":["inamuragasaki"]},{"id":"i67","time":"~17:30","title":"Dinner · Akimoto (Kamakura) or Santsuru (Kawasaki); then back to Kawasaki","kind":"food","how":"Akimoto: Aiza Kamakura 3F, 1-6-15 Komachi (3 min from Kamakura Sta) · Santsuru: 16-10 Ogawa-chō, Kawasaki\nBack: Kamakura → Totsuka → Kawasaki, ~35 min","notes":"Eat early in Kamakura: Akimoto (Tabelog 3.54, shirasu + Kamakura-vegetable tempura; closed Thu, Fri fine); walk in by ~18:00, L.O. 19:30. Or ride back and eat near the hotel: Santsuru (Tabelog 3.67, Top 100 Chinese, handmade gyōza; dinner only, 17:00–21:30; ☎ 044-233-1798, closed Tue; house rule one drink order pp, soft drinks fine)","places":["akimoto","santsuru","mets"]}]},{"date":"2026-11-21","label":"21 Nov","ja":"銀座","en":"Ginza","sub":"Tsukiji, Hama-rikyū, Ginza, night flight","mode":"transit","hotel":"","items":[{"id":"i68","time":"08:30","title":"Check out · JR-East Hotel Mets Kawasaki","kind":"travel","how":"Kawasaki","notes":"Check out early and leave the luggage at the hotel; collect it ~21:30 before the taxi to Haneda","places":["mets"],"action":"★ Confirm luggage storage from 08:30"},{"id":"i86","time":"~09:15–10:30","title":"Tsukiji Outer Market · snack breakfast","kind":"visit","how":"Keikyū Kawasaki → Higashi-Ginza (through-running onto the Toei Asakusa Line; some trains need a change at Sengakuji), ~35 min (est.), then ~8 min walk; or JR to Shimbashi + taxi ~5 min\nTsukiji Outer Market, 4-chōme Tsukiji, Chūō-ku, Tokyo","notes":"Shops ~09:00–14:00. Sat 21 Nov is open: a secondary source lists the Nov closures as 1, 3, 8, 11, 15, 18, 22, 23, 29 Nov and no Saturday closures Sep–Dec (the official calendar PDF is an image, not read). Saturdays are busy, so go early and keep together in the narrow lanes. Snacks: Tsukiji Yamachō tamagoyaki (06:00–15:30, daily) · Kitsuneya horumon-don (06:30–13:30; long-established, queues)","places":["tsukiji"]},{"id":"i87","time":"~10:45–12:00","title":"Hama-rikyū Gardens + Nakajima tea house","kind":"visit","how":"Hama-rikyū Gardens, 1-1 Hamarikyū-teien, Chūō-ku, Tokyo; ~7 min walk from Tsukiji (Ōtemon gate)","notes":"Flat paths around a tidal pond; ¥300, ¥150 at 65+ (bring ID), 09:00–17:00. Matcha + wagashi at the Nakajima-no-ochaya tea house on the pond (shoes off; to 16:30; ~¥720, unverified). A seated rest before Ginza\nIf wet: skip it; the Ginza Mitsukoshi basement food halls or the Kabuki-za single act instead","places":["hamarikyu"]},{"id":"i88","time":"~12:15–18:30","title":"Ginza · lunch, pedestrian zone, shopping","kind":"visit","how":"Walk or taxi from Hama-rikyū (~15 min / ~5 min)\nGinza Chūō-dōri, Tokyo","notes":"Chūō-dōri is car-free on Sat 12:00–17:00 (Oct–Mar; cancelled in bad weather). Lunch: Rengatei (Tabelog 3.68, est. 1895, birthplace of omurice; 11:15–15:00, L.O. 14:00, closed Sun; no reservations; expect a short queue at lunchtime). Rest: GINZA SIX rooftop garden (13F, free, 07:00–23:00). Café: Ginza Sembikiya fruit parlour, 5-5-1 Ginza (hours not checked; the Sembikiya Sōhonten parlour is in Nihonbashi, a different company) or Kimuraya anpan takeaway (since 1869). Coin lockers for shopping bags. Optional: Kabuki-za single-act (hitomakumi) seats, Nov programme Kanadehon Chūshingura (full-length, split 11:00 and 16:30); reserved single-act seats sold online from 12:00 JST the day before (credit card, max 4, ~¥600–2,800 per act, unverified), unreserved ones at the counter from 10:00 on the day (cash); 4th floor; no entry during Act 4 (通さん場); act times published ~1 Nov","places":["ginza","rengatei"],"action":"Optional ★ Kabuki-za hitomakumi: buy online Fri 20 Nov 12:00 JST (e-tix.jp/shochiku_makumi)"},{"id":"i70","time":"19:00","title":"Last dinner · Shiseido Parlour Ginza Honten (yōshoku, est. 1902)","kind":"food","how":"Tokyo Ginza Shiseido Bldg 4–5F, 8-8-3 Ginza; 5 min walk to JR Shimbashi","notes":"Tabelog 3.73; meat croquette + omurice à la carte ~¥3–5k (skip the full course); L.O. 20:30 fits the 21:00 departure. Closed Mon; Sat fine","places":["shiseido"],"action":"★ Reserve ~2–4 weeks ahead (Ikyu online / ☎ 03-5537-6241)"},{"id":"i71","time":"21:00–~22:05","title":"Transit · Ginza → Kawasaki (bags) → taxi to Haneda T2","kind":"travel","how":"JR Shimbashi → Kawasaki (Tōkaidō Line, ~15 min); collect bags at Mets; taxi Mets → Haneda Airport T2 (~20–25 min)","notes":"21:00 Leave Shiseido Parlour; 5 min walk to JR Shimbashi\n~21:25 Kawasaki; collect bags at Mets\n~21:40 Pre-booked large taxi from the hotel\n~22:05 Haneda T2, about 2 h 20 before the 00:25 flight\nCost: metered ~¥6–8k per car incl. the 22:00+ late-night surcharge (estimate). A standard taxi may not take 3 adults + 3 big suitcases, so book a wagon/jumbo: fixed-fare jumbo from Kawasaki-ku is ¥20,000 incl. tolls (rakurakutaxi.jp, book ≥24 h ahead)\nFallback: Keikyū Kawasaki → Haneda Airport T1·T2 Sta, ~20–25 min","places":["mets","haneda_t2"],"action":"★ Book a large taxi for 21:40 (Mets front desk, or a fixed-fare jumbo ≥24 h ahead)"},{"id":"i72","time":"~22:05","title":"Arrive Haneda T2 · ANA check-in","kind":"travel","how":"Haneda Airport T2, international area","notes":"ANA lists Singapore departures from T2 for the winter 2026 timetable (from 25 Oct); check the terminal on the e-ticket. Most T2 restaurants close ~22:00–22:30; only a FamilyMart (before security) and two food-court places (Kamata hanetsuki gyōza, Mugi to Olive) stay open to the last flight, and some lifts stop after midnight, so eat properly at Shiseido. If moved to T3: Setagaya Ramen, Edo-Kōji 4F landside, 24 h","places":["haneda_t2","haneda"],"mode":"driving"}]},{"date":"2026-11-22","label":"22 Nov","ja":"シンガポール","en":"Singapore","sub":"Land at Changi","mode":"transit","hotel":"","items":[{"id":"i73","time":"00:25","title":"Depart HND →
