<style id="app-style">
/* Layout: one day per screen, styled like a JR station nameplate (kanji, romaji, previous / next stop),
   then a single column of large stop cards; fixed bottom bar with four big tabs. */
:root {
  --bg: #f3f5f9;
  --surface: #ffffff;
  --ink: #0f1629;
  --muted: #434d63;
  --line: #cfd6e3;
  --ai: #1d3a8f;
  --ai-ink: #ffffff;
  --ai-soft: #e3e9f8;
  --go: #0a6b38;
  --go-ink: #ffffff;
  --warn: #7a4300;
  --warn-bg: #fff0d6;
  --now: #b3261e;
  --now-bg: #fdecea;
  --k-stay: #5a3ea6;
  --k-food: #9b3a12;
  --k-visit: #17695a;
  --k-travel: #36435c;
  --shadow: 0 1px 2px rgba(15,22,41,.08), 0 2px 8px rgba(15,22,41,.06);
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-ja: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  --fs: 20px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c111d; --surface: #161e31; --ink: #f2f4f9; --muted: #b9c1d4; --line: #2c3753;
    --ai: #9db2ff; --ai-ink: #0c111d; --ai-soft: #1f2a48; --go: #33b46c; --go-ink: #04150b;
    --warn: #ffcf86; --warn-bg: #3a2a10; --now: #ff8a80; --now-bg: #3d1a19;
    --k-stay: #c3b1ff; --k-food: #ffb08c; --k-visit: #79d8c3; --k-travel: #c2cbe0;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c111d; --surface: #161e31; --ink: #f2f4f9; --muted: #b9c1d4; --line: #2c3753;
  --ai: #9db2ff; --ai-ink: #0c111d; --ai-soft: #1f2a48; --go: #33b46c; --go-ink: #04150b;
  --warn: #ffcf86; --warn-bg: #3a2a10; --now: #ff8a80; --now-bg: #3d1a19;
  --k-stay: #c3b1ff; --k-food: #ffb08c; --k-visit: #79d8c3; --k-travel: #c2cbe0;
  --shadow: none; color-scheme: dark;
}
html { font-size: var(--fs); }
html.fs-s { --fs: 18px; }
html.fs-l { --fs: 23px; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 1rem; line-height: 1.45; -webkit-text-size-adjust: 100%; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--ai); }
:focus-visible { outline: 3px solid var(--ai); outline-offset: 2px; }
.ja { font-family: var(--f-ja); }
.wrap { max-width: 40rem; margin: 0 auto; padding-inline: 16px; padding-block: 0 7.5rem; }
.wrap.is-editing { padding-block-end: 13rem; }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in { max-width: 40rem; margin: 0 auto; padding: .5rem 16px; display: flex; align-items: center; gap: .5rem; }
.brand { font-weight: 700; font-size: .95rem; letter-spacing: .02em; flex: 1; min-width: 0; }
.brand small { display: block; font-weight: 400; color: var(--muted); font-size: .75rem; }
.chipbtn { min-height: 2.6rem; padding: 0 .8rem; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); font-weight: 700; font-size: .85rem; cursor: pointer; }
.chipbtn.on { background: var(--ai); color: var(--ai-ink); border-color: var(--ai); }

/* Station sign */
.sign { margin-top: 1rem; background: var(--surface); border: 3px solid var(--ink); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
.sign-top { background: var(--ai); color: var(--ai-ink); padding: .35rem .9rem; font-weight: 700; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; display: flex; justify-content: space-between; gap: .5rem; flex-wrap: wrap; }
.sign-mid { text-align: center; padding: .7rem .8rem .5rem; }
.sign-kanji { font-family: var(--f-ja); font-weight: 700; font-size: 2.6rem; line-height: 1.1; letter-spacing: .06em; }
.sign-romaji { font-weight: 700; font-size: 1.25rem; margin-top: .15rem; }
.sign-sub { color: var(--muted); font-size: .95rem; margin-top: .35rem; text-wrap: balance; }
.sign-rail { display: grid; grid-template-columns: 1fr 1fr; border-top: 6px solid var(--ai); }
.sign-rail button { min-height: 3.4rem; border: 0; background: var(--ai-soft); cursor: pointer; font-weight: 700; font-size: .9rem; padding: .3rem .7rem; display: flex; align-items: center; gap: .35rem; min-width: 0; }
.sign-rail button:disabled { opacity: .35; cursor: default; }
.sign-rail .nx { justify-content: flex-end; text-align: right; border-left: 2px solid var(--surface); }
.sign-rail span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sign-rail small { display: block; font-weight: 400; font-size: .7rem; color: var(--muted); }

/* Notices */
.note { margin-top: 1rem; padding: .8rem 1rem; border-radius: 10px; background: var(--ai-soft); font-size: .95rem; }
.note b { display: block; font-size: 1.05rem; }
.note.warn { background: var(--warn-bg); color: var(--warn); }

/* Tonight */
.tonight { margin-top: 1rem; background: var(--surface); border: 2px solid var(--k-stay); border-radius: 12px; padding: .8rem 1rem 1rem; }
.eyebrow { font-size: .75rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.tonight h3 { margin: .1rem 0 .1rem; font-size: 1.2rem; }

/* Stop cards */
.list { list-style: none; margin: 1rem 0 0; padding: 0; display: grid; gap: .9rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: .9rem 1rem 1rem; box-shadow: var(--shadow); min-width: 0; }
.card.is-now { border: 3px solid var(--now); }
.card-head { display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap; }
.time { font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.kind { font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: .15rem .5rem; border-radius: 6px; border: 2px solid currentColor; }
.k-stay { color: var(--k-stay); } .k-food { color: var(--k-food); } .k-visit { color: var(--k-visit); } .k-travel, .k-rest { color: var(--k-travel); }
.nowtag { margin-left: auto; background: var(--now); color: var(--surface); font-weight: 700; font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; padding: .2rem .55rem; border-radius: 6px; }
.card h3 { margin: .35rem 0 0; font-size: 1.15rem; line-height: 1.3; text-wrap: balance; }
.lede { color: var(--muted); margin: .3rem 0 0; font-size: .95rem; }
.place { margin-top: .8rem; padding-top: .7rem; border-top: 1px dashed var(--line); }
.place:first-of-type { border-top: 0; padding-top: 0; }
.place-name { font-weight: 700; }
.place-ja { font-family: var(--f-ja); color: var(--muted); font-size: .9rem; }
.btns { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .55rem; }
.btn { flex: 1 1 9rem; min-height: 3.3rem; display: inline-flex; align-items: center; justify-content: center; gap: .45rem; padding: .4rem .9rem; border-radius: 10px; font-weight: 700; font-size: 1rem; text-decoration: none; cursor: pointer; border: 2px solid var(--ink); background: var(--surface); color: var(--ink); text-align: center; line-height: 1.15; }
.btn svg { width: 1.3em; height: 1.3em; flex: none; }
.btn.go { background: var(--go); border-color: var(--go); color: var(--go-ink); }
.btn.small { flex: 0 1 auto; min-height: 2.8rem; font-size: .9rem; }
.mc { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; margin-top: .55rem; font-size: .9rem; }
.mc code { font-family: var(--f-body); font-weight: 700; font-size: 1.1rem; font-variant-numeric: tabular-nums; background: var(--ai-soft); padding: .15rem .5rem; border-radius: 6px; user-select: all; }
details.more { margin-top: .8rem; }
details.more > summary { min-height: 2.8rem; display: flex; align-items: center; gap: .4rem; cursor: pointer; font-weight: 700; color: var(--ai); list-style: none; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::before { content: "+"; display: inline-grid; place-items: center; width: 1.6rem; height: 1.6rem; border-radius: 50%; border: 2px solid currentColor; font-size: 1rem; }
details.more[open] > summary::before { content: "−"; }
.dl { display: grid; gap: .7rem; font-size: .95rem; }
.dl h4 { margin: 0 0 .2rem; font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.dl p { margin: 0 0 .35rem; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: .3rem; }
.steps li { display: grid; grid-template-columns: 5.2rem 1fr; gap: .5rem; }
.steps b { font-variant-numeric: tabular-nums; }
.action { background: var(--warn-bg); color: var(--warn); padding: .5rem .7rem; border-radius: 8px; }

/* Lists: all days, hotels, help */
h2.page { font-size: 1.5rem; margin: 1.2rem 0 .2rem; }
.pagesub { color: var(--muted); margin: 0 0 1rem; }
.daylist { list-style: none; margin: 0; padding: 0; display: grid; gap: .6rem; }
.dayrow { width: 100%; display: grid; grid-template-columns: 4.2rem 1fr auto; align-items: center; gap: .8rem; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: .7rem .9rem; cursor: pointer; min-height: 4.4rem; }
.dayrow.today { border: 3px solid var(--now); }
.dayrow .d { font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.dayrow .d small { display: block; font-weight: 400; color: var(--muted); font-size: .8rem; }
.dayrow .t { min-width: 0; }
.dayrow .t b { display: block; }
.dayrow .t span { color: var(--muted); font-size: .9rem; }
.dayrow .kj { font-family: var(--f-ja); font-weight: 700; font-size: 1.1rem; color: var(--ai); }
.hotel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: .9rem 1rem 1rem; }
.hotel + .hotel { margin-top: .9rem; }
.hotel h3 { margin: .1rem 0; font-size: 1.2rem; }
.addr { font-family: var(--f-ja); font-size: .95rem; margin-top: .3rem; }
.sos { display: grid; gap: .6rem; }
.sos a, .sos .row { display: flex; justify-content: space-between; align-items: center; gap: .8rem; padding: .8rem 1rem; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; text-decoration: none; color: var(--ink); }
.sos .num { font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--now); white-space: nowrap; }
.sos small { display: block; color: var(--muted); font-size: .85rem; }
.phrases { display: grid; gap: .6rem; }
.phrase { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: .8rem 1rem; cursor: pointer; }
.phrase .ja { display: block; font-size: 1.3rem; font-weight: 700; }
.phrase small { color: var(--muted); }
.todo { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; }
.todo li { display: grid; grid-template-columns: 2rem 1fr; gap: .6rem; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: .6rem .8rem; font-size: .92rem; }
.todo li.done .tt { text-decoration: line-through; color: var(--muted); }
.todo input { width: 1.5rem; height: 1.5rem; margin-top: .1rem; }
.todo small { display: block; color: var(--muted); }
section.block { margin-top: 1.6rem; }
section.block > h3 { font-size: 1.15rem; margin: 0 0 .6rem; }

/* Bottom tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 2px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs-in { max-width: 40rem; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { min-height: 4.2rem; border: 0; background: none; cursor: pointer; display: grid; place-items: center; align-content: center; gap: .15rem; font-weight: 700; font-size: .8rem; color: var(--muted); padding: .3rem 0; }
.tab svg { width: 1.6rem; height: 1.6rem; }
.tab[aria-current="page"] { color: var(--ai); box-shadow: inset 0 4px 0 var(--ai); }
.editbar { display: flex; gap: .5rem; padding: .6rem 16px; max-width: 40rem; margin: 0 auto; align-items: center; flex-wrap: wrap; }
.editbar .msg { flex: 1 1 100%; font-size: .85rem; color: var(--muted); }
.editbar .btn { flex: 1 1 8rem; }

/* Overlays: taxi card, editors */
.overlay { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; padding: calc(env(safe-area-inset-top, 0px) + 1rem) 16px calc(env(safe-area-inset-bottom, 0px) + 1.5rem); }
.overlay-in { max-width: 40rem; margin: 0 auto; }
.taxi { background: #ffffff; color: #000000; border: 4px solid #000000; border-radius: 14px; padding: 1.2rem 1rem; }
.taxi .ask { font-family: var(--f-ja); font-size: 1.35rem; font-weight: 700; }
.taxi .tname { font-family: var(--f-ja); font-size: 2.3rem; font-weight: 700; line-height: 1.2; margin: .6rem 0 .4rem; word-break: break-word; }
.taxi .taddr { font-family: var(--f-ja); font-size: 1.5rem; line-height: 1.4; word-break: break-word; }
.taxi .tline { font-family: var(--f-ja); font-size: 1.2rem; margin-top: .6rem; }
.taxi .tline span { white-space: nowrap; }
.taxi .en { font-family: var(--f-body); font-size: .9rem; color: #333333; margin-top: .8rem; border-top: 1px solid #999999; padding-top: .6rem; }
.bigphrase { font-family: var(--f-ja); font-size: 2.4rem; font-weight: 700; line-height: 1.3; }
.form { display: grid; gap: .9rem; }
.form label { display: grid; gap: .25rem; font-weight: 700; font-size: .9rem; }
.form label small { font-weight: 400; color: var(--muted); }
.form input, .form select, .form textarea { width: 100%; padding: .6rem .7rem; border: 2px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 1rem; }
.form textarea { min-height: 7rem; resize: vertical; line-height: 1.4; }
.form .two { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
.form fieldset { border: 2px solid var(--line); border-radius: 10px; padding: .8rem; display: grid; gap: .7rem; margin: 0; min-width: 0; }
.form legend { font-weight: 700; padding: 0 .3rem; }
.linked { display: grid; gap: .4rem; }
.linked .row { display: flex; gap: .5rem; align-items: center; justify-content: space-between; background: var(--ai-soft); border-radius: 8px; padding: .4rem .6rem; }
.linked .row span { min-width: 0; overflow-wrap: anywhere; }
.edit-tools { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .8rem; padding-top: .7rem; border-top: 2px solid var(--ai-soft); }
.edit-tools .btn { flex: 1 1 4.5rem; min-height: 2.8rem; font-size: .9rem; border-color: var(--ai); color: var(--ai); }
.confirm { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-top: .6rem; background: var(--now-bg); color: var(--now); padding: .6rem; border-radius: 8px; font-weight: 700; }
.confirm .btn { flex: 1 1 7rem; min-height: 2.8rem; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 5.5rem); z-index: 30; background: var(--ink); color: var(--bg); padding: .7rem 1rem; border-radius: 10px; font-weight: 700; max-width: calc(100% - 32px); box-shadow: 0 4px 16px rgba(0,0,0,.25); }
.addstop { width: 100%; margin-top: .9rem; border-style: dashed; color: var(--ai); border-color: var(--ai); }
@media (max-width: 380px) { .sign-kanji { font-size: 2.1rem; } .steps li { grid-template-columns: 4.4rem 1fr; } }
@media (prefers-reduced-motion: no-preference) { .card.is-now { animation: pulse 2s ease-out 1; } @keyframes pulse { from { box-shadow: 0 0 0 6px var(--now-bg); } to { box-shadow: var(--shadow); } } }
</style>

function place(id) { return data.places[id]; }
function itemMode(day, it) { return it.mode || day.mode || "transit"; }
function nowInfo(dayIdx) {
  var day = data.days[dayIdx], now = jstNow();
  if (!day || day.date !== now.date) return { now: null, next: null };
  var cur = null, nxt = null;
  day.items.forEach(function (it) { var m = startMin(it.time); if (m == null) return; if (m <= now.min) cur = it.id; else if (!nxt) nxt = it.id; });
  return { now: cur, next: nxt };
}

  else if (S.view === "day") h += viewDay(S.day);

  else if (S.view === "hotels") h += viewHotels();

}

function viewToday() {
  var i = todayIndex(), now = jstNow(), first = data.days[0], last = data.days[data.days.length - 1];

  if (now.date < first.date) {

    h += '<div class="note"><b>The trip starts in ' + n + (n === 1 ? " day" : " days") + "</b>" + esc(weekday(first.date, true)) + " " + esc(first.label) + ". During the trip this screen opens on the right day by itself.</div>";
    return h + viewDay(0, true);

function details(it, mode) {

  if (it.notes) parts += "<div><h4>" + (/^~?\d{1,2}:\d{2}/m.test(it.notes) ? "Step by step" : "Good to know") + "</h4>" + paras(it.notes) + "</div>";

function paras(txt) {
  var lines = String(txt).split("\n"), out = "", steps = [];
  function flush() { if (steps.length) { out += '<ul class="steps">' + steps.join("") + "</ul>"; steps = []; } }
  lines.forEach(function (l) {
    var m = /^(~?\d{1,2}:\d{2}(?:[–-]~?\d{1,2}:\d{2})?)\s+(.*)$/.exec(l);
    if (m) steps.push("<li><b>" + esc(m[1]) + "</b><span>" + esc(m[2]) + "</span></li>");
    else if (l.trim()) { flush(); out += "<p>" + esc(l) + "</p>"; }
  });
  flush();
  return out;
}

  var modes = Object.keys(MODE).map(function (x) { return '<option value="' + x + '"' + (d.mode === x ? " selected" : "") + ">" + MODE[x] + "</option>"; }).join("");
  openLayer('<h2 class="page">Edit ' + esc(d.label) + '</h2><form class="form" id="day-form" data-i="' + i + '">' +
    '<div class="two"><label>Place name (romaji)<input id="d-en" value="' + esc(d.en) + '"></label><label>Place name (kanji)<input id="d-ja" class="ja" value="' + esc(d.ja) + '"></label></div>' +
    '<label>One-line summary<input id="d-sub" value="' + esc(d.sub) + '"></label>' +
    '<label>Usual way of getting around<small>Sets the Directions buttons for this day. A stop can override it.</small><select id="d-mode">' + modes + "</select></label>" +
    '<label>Hotel tonight<select id="d-hotel"><option value="">None (flight or travel night)</option>' + placeOptions(d.hotel) + "</select></label>" +
    '<div class="btns"><button type="button" class="btn" data-act="close">Cancel</button><button type="submit" class="btn go">Done</button></div></form>');
}
function contactsForm() {
  var rows = data.contacts.map(function (c, k) { return '<fieldset><legend>Contact ' + (k + 1) + '</legend><label>Name<input id="c-l' + k + '" value="' + esc(c.label) + '"></label><div class="two"><label>Phone<input id="c-t' + k + '" value="' + esc(c.tel) + '"></label><label>Note<input id="c-n' + k + '" value="' + esc(c.note) + '"></label></div></fieldset>'; }).join("");
  openLayer('<h2 class="page">Edit contacts</h2><p class="pagesub">Clear a name to remove that contact. Add your own mobile numbers here.</p><form class="form" id="contacts-form">' + rows +
    '<fieldset><legend>New contact</legend><label>Name<input id="c-lnew"></label><div class="two"><label>Phone<input id="c-tnew"></label><label>Note<input id="c-nnew"></label></div></fieldset>' +
    '<div class="btns"><button type="button" class="btn" data-act="close">Cancel</button><button type="submit" class="btn go">Done</button></div></form>');
}

/* Rebuild the whole page from state, in the same shape the page was published in. */
function buildDocument() {
  var json = JSON.stringify(data).replace(/</g, "\\u003c").replace(new RegExp("\\u2028", "g"), "\\u2028").replace(new RegExp("\\u2029", "g"), "\\u2029");
  var C = "</" + "script>";
  return "<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>" + SKELETON_RESET + "</style></head><body>\n" +
    "<title>" + esc(data.title) + "</title>\n" +
    '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n' +
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=BIZ+UDPGothic:wght@400;700&display=swap">\n' +
    '<style id="app-style">' + STYLE_TEXT + "</style>\n" +
    '<div id="app"></div>\n<div id="layer"></div>\n' +
    '<script type="application/json" id="trip-data">' + json + C + "\n" +
    '<script id="app-script">' + SCRIPT_TEXT + C + "\n</body></html>";
}
function save() {
  if (!S.art || S.saving) return;
  var d = jstNow().date.split("-");
  data.updated = (+d[2]) + " " + ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+d[1] - 1] + " " + d[0];
  changed();
  S.saving = true; render();
  S.art.publish(buildDocument()).then(function () {
    toast("Saved. Everyone now sees the new itinerary.");
  }, function (e) {
    S.saving = false;
    var c = e && e.code;
    if (c === "conflict") toast("A newer version was saved elsewhere. The page will reload; your edits are kept as a draft.");
    else if (c === "not_writer" || c === "not_granted" || c === "consent_required" || c === "not_declared" || c === "capability_disabled") { S.canEdit = false; S.editing = false; toast("This view can only read the trip. Open it in Claude as the owner to save."); }
    else if (c === "too_large") toast("The itinerary is too large to save. Shorten some long notes and try again.");
    else if (c === "rate_limited") toast("Saved too often just now. Wait a minute, then press Save again.");
    else toast("Could not save just now. Your edits are kept; press Save again in a minute.");
    render();
  });
}

/* ---------- events ---------- */
document.addEventListener("click", function (ev) {
  var b = ev.target.closest("[data-act]"); if (!b) return;
  var a = b.getAttribute("data-act"), i = +b.getAttribute("data-i"), k = +b.getAttribute("data-k");
  if (a === "copy") {
    var txt = b.getAttribute("data-t");
    var done = function () { toast("Copied " + txt); };
    try { navigator.clipboard.writeText(txt).then(done, function () { selectNear(b); }); } catch (e) { selectNear(b); }
    return;
  }
  if (a === "todo") return;
  if (b.tagName === "A") return;
  ev.preventDefault();
  switch (a) {
    case "tab": S.view = b.getAttribute("data-v"); if (S.view === "today" && todayIndex() >= 0) { S.view = "day"; S.day = todayIndex(); } render(); scrollTop(); if (S.view === "day") scrollToNow(); break;
    case "goday": if (data.days[i]) { S.view = "day"; S.day = i; render(); scrollTop(); scrollToNow(); } break;
    case "taxi": taxiCard(b.getAttribute("data-p"), b.getAttribute("data-hotel") === "1"); break;
    case "phrase": phraseCard(k); break;
    case "close": closeLayer(); break;
    case "size": cycleSize(); break;
    case "edit-toggle": S.editing = !S.editing; S.confirmDel = null; render(); break;
    case "edit-item": itemForm(i, k); break;
    case "add-item": itemForm(i, null); break;
    case "edit-day": dayForm(i); break;
    case "edit-contacts": contactsForm(); break;
    case "move": var its = data.days[i].items, d = +b.getAttribute("data-d"), x = its[k]; its[k] = its[k + d]; its[k + d] = x; changed(); render(); var el = document.getElementById("c-" + x.id); if (el) el.scrollIntoView({ block: "center" }); break;
    case "del": S.confirmDel = data.days[i].items[k].id; render(); var e2 = document.getElementById("c-" + S.confirmDel); if (e2) e2.scrollIntoView({ block: "center" }); break;
    case "del-yes": data.days[i].items.splice(k, 1); S.confirmDel = null; changed(); render(); toast("Stop deleted. Press Save to keep the change."); break;
    case "del-no": S.confirmDel = null; render(); break;
    case "pl-unlink": readItemForm(); draftItem.it.places.splice(+b.getAttribute("data-j"), 1); renderItemForm(); break;
    case "pl-edit": readItemForm(); placeForm(b.getAttribute("data-p")); break;
    case "pl-new": readItemForm(); placeForm(null); break;
    case "pl-back": renderItemForm(); break;
    case "discard": data = JSON.parse(SAVED_JSON); S.dirty = false; ls(DRAFT_KEY, null); render(); toast("Changes thrown away."); break;
    case "save": save(); break;
    case "draft-resume": data = S.draftOffer.data; S.draftOffer = null; S.dirty = true; S.editing = true; render(); break;
    case "draft-drop": S.draftOffer = null; ls(DRAFT_KEY, null); render(); break;
  }
});
document.addEventListener("change", function (ev) {
  var t = ev.target;
  if (t.id === "f-link" && t.value) { readItemForm(); if (draftItem.it.places.indexOf(t.value) < 0) draftItem.it.places.push(t.value); renderItemForm(); }
  if (t.getAttribute && t.getAttribute("data-act") === "todo") { var td = data.todo[+t.getAttribute("data-k")]; td.done = t.checked; t.closest("li").className = t.checked ? "done" : ""; changed(); render(); }
  if (t.id === "p-link") { var c = parseMapsLink(t.value); if (c) { $("#p-lat").value = c[0]; $("#p-lng").value = c[1]; toast("Position filled in from the link."); } else toast("No position found in that link. Open the place in Google Maps on a computer and copy the address-bar link."); }
});
document.addEventListener("submit", function (ev) {
  ev.preventDefault();
  var f = ev.target;
  if (f.id === "item-form") {
    readItemForm();
    if (!draftItem.it.title) { toast("Give the stop a title."); return; }
    var its = data.days[draftItem.di].items;
    if (draftItem.k == null) its.push(draftItem.it); else its[draftItem.k] = draftItem.it;
    var id = draftItem.it.id; changed(); closeLayer(); render();
    var el = document.getElementById("c-" + id); if (el) el.scrollIntoView({ block: "center" });
  } else if (f.id === "place-form") {
    var p = draftPlace.p;
    p.en = $("#p-en").value.trim(); p.ja = $("#p-ja").value.trim(); p.addr = $("#p-addr").value.trim();
    var lat = parseFloat($("#p-lat").value), lng = parseFloat($("#p-lng").value);
    p.lat = isFinite(lat) ? lat : ""; p.lng = isFinite(lng) ? lng : "";
    p.mc = $("#p-mc").value.trim(); p.tel = $("#p-tel").value.trim();
    if (!p.en) { toast("Give the place an English name."); return; }
    var pid = draftPlace.id || slug(p.en);
    data.places[pid] = p;
    if (draftItem.it.places.indexOf(pid) < 0) draftItem.it.places.push(pid);
    changed(); renderItemForm();
  } else if (f.id === "day-form") {
    var d = data.days[+f.getAttribute("data-i")];
    d.en = $("#d-en").value.trim(); d.ja = $("#d-ja").value.trim(); d.sub = $("#d-sub").value.trim(); d.mode = $("#d-mode").value; d.hotel = $("#d-hotel").value;
    changed(); closeLayer(); render();
  } else if (f.id === "contacts-form") {
    var out = [];
    data.contacts.forEach(function (c, k) { var l = $("#c-l" + k).value.trim(); if (l) out.push({ label: l, tel: $("#c-t" + k).value.trim(), note: $("#c-n" + k).value.trim() }); });
    var nl = $("#c-lnew").value.trim(); if (nl) out.push({ label: nl, tel: $("#c-tnew").value.trim(), note: $("#c-nnew").value.trim() });
    data.contacts = out; changed(); closeLayer(); render();
  }
});
document.addEventListener("keydown", function (ev) { if (ev.key === "Escape" && document.getElementById("layer").innerHTML) closeLayer(); });

function selectNear(b) { var code = b.parentNode.querySelector("code"); if (!code) return; var r = document.createRange(); r.selectNodeContents(code); var s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Selected. Use your phone’s Copy."); }
function scrollTop() { try { window.scrollTo(0, 0); } catch (e) {} }
function scrollToNow() { var el = document.querySelector(".card.is-now"); if (el) setTimeout(function () { el.scrollIntoView({ block: "center" }); }, 60); }
var SIZES = ["fs-m", "fs-l", "fs-s"];
function applySize(s) { var h = document.documentElement; h.classList.remove("fs-s", "fs-l", "fs-m"); h.classList.add(s); }
function cycleSize() { var cur = ls("jp26-size") || "fs-m"; var nx = SIZES[(SIZES.indexOf(cur) + 1) % SIZES.length]; ls("jp26-size", nx); applySize(nx); toast(nx === "fs-l" ? "Large text" : nx === "fs-s" ? "Small text" : "Normal text"); }

/* ---------- start ---------- */
applySize(ls("jp26-size") || "fs-m");
if (todayIndex() >= 0) { S.view = "day"; S.day = todayIndex(); }
var hash = (location.hash || "").replace("#", "");
if (/^day\d{1,2}$/.test(hash) && data.days[+hash.slice(3) - 1]) { S.view = "day"; S.day = +hash.slice(3) - 1; }
else if (["days", "hotels", "help"].indexOf(hash) >= 0) S.view = hash;
render(); scrollToNow();
setInterval(function () { if (!S.editing && !document.getElementById("layer").innerHTML && S.view === "day" && S.day === todayIndex()) { var y = window.scrollY; render(); window.scrollTo(0, y); } }, 120000);

if (window.claude && window.claude.use) {
  Promise.all([window.claude.use("artifact"), window.claude.use("user")]).then(function (r) {
    var art = r[0], user = r[1];
    if (!art || !user) return;
    return Promise.all([user.canEdit(), user.isOwner()]).then(function (c) {
      if (!(c[0] || c[1])) return;
      S.art = art; S.canEdit = true;
      var raw = ls(DRAFT_KEY);
      if (raw) { try { var dr = JSON.parse(raw); if (dr && dr.data && JSON.stringify(dr.data) !== JSON.stringify(data)) S.draftOffer = dr; else ls(DRAFT_KEY, null); } catch (e) { ls(DRAFT_KEY, null); } }
      if (!document.getElementById("layer").innerHTML) { var y = window.scrollY; render(); window.scrollTo(0, y); }
    });
  }).catch(function () {});
}
})();
</script>
